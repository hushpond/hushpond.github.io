project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/*/index.qmd"
  resources:
    - cv.pdf

website:
  title: "WONJAE HEO"
  site-url: https://hushpond.github.io
  favicon: ""
  page-navigation: false
  bread-crumbs: false
  sidebar:
    style: docked
    title: ""
    search: false
    header: |
      <a class="wj-name" href="/"><span class="wj-first">WONJAE</span><span class="wj-last">HEO</span></a>
    contents:
      - href: index.qmd
        text: ABOUT
      - href: cv.qmd
        text: CV / CONTACT
      - text: "---"
      - href: projects.qmd
        text: PROJECTS
      - href: writing.qmd
        text: WRITING
    footer: |
      <div class="wj-foot"><a href="mailto:hushpond@gmail.com" aria-label="Email"><i class="bi bi-envelope-fill"></i></a><a href="https://github.com/hushpond" aria-label="GitHub"><i class="bi bi-github"></i></a><p>© Wonjae Heo. All rights reserved.<br>(Last updated: November 1, 2026)</p></div>

format:
  html:
    theme: [default, theme.scss]
    css: styles.css
    toc: false
    page-layout: full
    lang: en
    smooth-scroll: false
    link-external-newwindow: true
    title-block-style: none
    anchor-sections: false
