project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/*/index.qmd"
  resources:
    - cv.pdf

website:
  title: "Wonjae Heo"
  site-url: https://hushpond.github.io
  favicon: ""
  page-navigation: false
  bread-crumbs: false
  # 메뉴·언어 전환·바닥글은 Quarto 기본 사이드바 대신 _header.html / _footer.html 에서 직접 그린다.
  # 메뉴 항목을 바꾸려면 _header.html 의 <nav> 안 링크를 고칠 것.

format:
  html:
    theme: [default, theme.scss]
    css: styles.css
    toc: false
    page-layout: custom
    lang: en
    smooth-scroll: false
    link-external-newwindow: true
    title-block-style: none
    anchor-sections: false
    include-in-header: _lang-head.html
    include-before-body: _header.html
    include-after-body: _footer.html
