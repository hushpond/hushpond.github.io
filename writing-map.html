<script>
(function () {
const D = {"essays": [{"id": "e1", "ko": "해체, 언어: 슬금슬금 이름표 붙이기", "en": "Deconstruction, Language: Name Tags Slipped On Little by Little"}, {"id": "e2", "ko": "무너지는 민원대", "en": "The Crumbling Service Counter"}, {"id": "e3", "ko": "시나브로, 기계학습", "en": "Imperceptibly, Machine Learning"}, {"id": "e4", "ko": "불평등은 언제나 우리 곁에", "en": "Inequality Is Always Beside Us"}, {"id": "e5", "ko": "언어가 칼날이 될 때", "en": "When Language Becomes a Blade"}, {"id": "e6", "ko": "탈 것", "en": "Vehicles"}, {"id": "e7", "ko": "한국적 상상력", "en": "The Korean Imagination"}, {"id": "e8", "ko": "입틀막의 역학: 캔슬 컬처는 어떻게 작동하는가", "en": "The Mechanics of Silencing: How Cancel Culture Works"}, {"id": "e9", "ko": "기계학습은 탈선할 수 있는가? 탈선의 경계선 명확히 그리기", "en": "Can Machine Learning Derail? Drawing the Boundary of Derailment Clearly"}], "map": {"method": "lsa", "points": [{"x": 9.786, "y": 1.453, "c": 9, "e": "e1", "t": "의식이 언어를 지배하는 것일까, 언어가 의식을 지배하는 것일까? 이 글은 이런 의문에서 시작되었다. 인간이 의식적으로 ‘나는 지금 말을 하는 중이다’라고 생각하지는 않지만, 언어는 우리가 숨 쉬듯 자연스레, 의식적이지만 무의식적으로 우리의 감각을 통해 드나든다. 우리의 무의식을 잠식하는 언어는 이제 단순한 기호가 아니다. 누군가에게 언어는 권력의 상징이며, 누군가에게 언어는 생존의 도구다.…"}, {"x": 8.846, "y": 1.931, "c": 9, "e": "e1", "t": "단순하고 직관적인 어휘와 글들로 사람들을 설득하기는 쉽다. 여러 사실관계를 관통하고 있는 하나의 축을 찾아서 나와 다른 생각을 하는 사람들에게 제시(라고 쓰고 투척이라고 읽고 싶다만)하는 것 또한 쉬울 수 있다. 하지만 그것이 모든 인과관계를 포괄하지는 않는다는 사실을 깨닫는 데에는 꽤 오랜 시간이 걸린다. 대표적인 예시가 은유다. 은유를 통해 무언가를 설명하는 행위는 필연적으로 진리를…"}, {"x": 9.117, "y": 1.997, "c": 9, "e": "e1", "t": "사이다라는 수식어가 낯설지 않은 사람들이 있다. 정치인 혹은 연예인 중에서 남들이 입 밖으로 꺼내기 힘들어하는 통쾌한 이야기를 거리낌 없이 꺼내는 사람들에게 이 수식어가 자주 붙는 것 같다. 왜 우리의 부모님들은 사이다 먹지 말라고 했을까. 몸에 나쁘기 때문에, 계속 마시면 충치가 생기니까. 이런 면에서 사이다는 분명 우리 몸에 나쁜 영향을 끼치는 ‘부정적’인 의미를 가진다. 하지만…"}, {"x": 9.126, "y": 2.062, "c": 9, "e": "e1", "t": "사회적 맥락에서 사용되는 ‘사이다’라는 언어는 대체로 우리가 흔히 떠올리는 탄산음료 ‘사이다’의 긍정적인 면모를 닮았다. ‘사이다’는 또한 사회적인 맥락에서 냉소주의라는 어감을 담고 있다. 악한 행위를 벌인 어떤 사람 혹은 집단에 ‘필터링 없이’ 반박 혹은 보복성 행위를 벌인 사람에게 우리 사회는 ‘사이다’라는 표현을 쓰곤 한다. 한 가지 흥미로운 점은, 우리가 오랫동안 사용해오던 어휘의…"}, {"x": 9.097, "y": 2.138, "c": 9, "e": "e1", "t": "또 하나 흥미로운 점은, ‘고구마’라는 어휘도 사이다의 반대말 격으로 사회적 맥락에서 사용되고 있다는 점에 있다. 사이다는 원관념의 긍정적인 면만을 가지고 왔듯이, ‘고구마’는 원관념의 부정적인 면만을 일컫는다는 사실로부터 하나의 결론을 내릴 수 있다. 우리가 어떤 대상을 은유에 활용하는 과정에서 은유하고자 하는 대상의 수많은 특징이 은폐되며, 따라서 우리가 강조하고자 하는 ‘단 하나의’…"}, {"x": 8.835, "y": 1.86, "c": 9, "e": "e1", "t": "분명 은유는 우리가 세상을 관찰하고 이해하는 데에 큰 도움을 준다. 하지만 은유로만 모든 것을 이해하고 세계관을 만들어 나가려는 시도는 감히 저지되어야 한다고 말하고 싶다. 우리의 이해력을 더 게으르게, 더 편협하게 만들 수 있는 은유의 남발은 분명 경계해야 한다. 사회학자 스티브 브루스는 이러한 은유의 문제점을 다음과 같이 설명했다."}, {"x": 8.764, "y": 1.849, "c": 9, "e": "e1", "t": "나 또한 한때는 은유를 통해 사회를 설명하는 것이 정말 직관적이고 인상적인 묘사 방법이라고 생각했다. 하지만 은유가 의식적으로든 무의식적으로든 진리를 은폐할 수 있다는 점을 깨닫는 데에는 꽤 긴 시간이 필요했다. 그만큼 은유는 ‘중독성’과 ‘편리성’이라는 특성을 모두 가진 강력한 양날의 검이다."}, {"x": 9.026, "y": 1.71, "c": 9, "e": "e1", "t": "이 세상 모든 것들을 은유로 그려낼 수 있다는 명제는 단언컨대 거짓이다. 은유가 ‘어려운 사실관계’를 직관적으로 그려낼 수 있는 도구라는 사실을 부정하지는 않겠다. 하지만 은유는 우리가 알아야만 하는 많은 사실관계를 은폐한다. 감각의 한 측면을 왜곡시킴과 동시에 다른 한 측면을 부각함으로써 특정 견해에 치우친 시각을 가지기 쉽게 만든다. 이런 은유의 특징이 가장 극적으로 작동하는 곳이 바로…"}, {"x": 8.994, "y": 1.811, "c": 9, "e": "e1", "t": "이러한 맥락에서, 이른바 제도권 관계자들이 사용하는 은유 또한 얼마든지 비판받을 수 있어야 한다는 점을 짚고 넘어가고자 한다. 이들은 아무 때나 은유를 동원해가면서 정제되지 않은 언어를 사용하는 것이 어떤 부작용을 가져올지 모르는 것 같다. 어떤 이들은 표현의 자유를 외치지만 표현의 자유가 가질 수 있는 부작용은 애써 모른 체하는 것 같다. 모든 정치인이 ‘화합’을 외치지만 그들의 언어에서…"}, {"x": 9.522, "y": -0.831, "c": 8, "e": "e1", "t": "철학자 알래스데어 매킨타이어는 저서 ‘덕의 상실’에서 사회과학에서 일반화가 가지는 체계적 예측 불가능성에는 여러 이유가 있다고 말한다. 그중 몇 가지가 이 글에서 다루고자 하는 일반화의 위험성과 맞닿아 있다. 첫째는 사회과학에서의 일반화에 “보편적 수량화의 가능성이 결여”되었을 뿐만 아니라 “타당성 영역의 변형 가능성이 존재”한다는 점이다. 둘째는 “개별 행위자의 특정한 미래 행위에 대한…"}, {"x": 9.52, "y": -0.76, "c": 8, "e": "e1", "t": "하지만 매킨타이어는 사회에서는 “하나의 게임이 아니라 몇 가지 게임이 이루어진다”고 말한다. 즉 실제 삶의 상황에서 우리는 게임이론에 대해 다루고 있는 교과서의 사례와는 다르게 “정해진 숫자의 참여자를 부여받지 않는다”는 것이다. 달리 말하자면 실제 사회에서는 “확정되고 헤아릴 수 있는 수의 요소들이 존재하지 않는다”. 이에 따라 매킨타이어는 “복합적인 모든 상황 속에 포함되어 있는…"}, {"x": 13.718, "y": -0.376, "c": 6, "e": "e1", "t": "정치권력의 등장 혹은 재생산을 위해서는 그 세력만의 ‘캐치프레이즈’가 필요하다. 대체로 그 캐치프레이즈는 시대의 열망을 담고 있다. 지금 이 시대의 열망은 공정과 상식인 듯하다. 시대의 열망은 어떻게 만들어지는 것일까? 사회에 큰 파장을 일으킬 만한 어떤 사건이 발생했다고 가정하자. 그러면 사건을 둘러싼 뒷말이 이러쿵저러쿵 나올 것이다. 그런 뒷말들이 모여서 하나의 여론이 된다. 여론은…"}, {"x": 10.047, "y": -0.808, "c": 8, "e": "e1", "t": "어떤 사람을 보고 그 사람이 속한 집단을 일반화하려는 시도는 끊임없이 일어난다. 일반화라는 접근법이 굉장히 위험할 수 있다는 사실을 알고 있음에도 불구하고 우리의 뇌는 일반화라는 마약을 끊기 어렵다. 일반화가 우리 뇌를 잠식하는 이유는 단순하다. 직관적이기 때문이다. 만약 우리의 뇌가 ‘일반화’를 시도하지 않는다면, 일반화하기 이전에 수많은 사실관계를 꿰뚫고 서로 다른 사람들이 가지고 있을…"}, {"x": 14.198, "y": -0.597, "c": 6, "e": "e1", "t": "매킨타이어의 이론은 공정에 관한 담론을 정치권이 수용하고 일반화해 나가는 과정에서 발생할 수 있는 오류를 지적하는 데에 유용한 근거가 될 수 있다고 느꼈다. 정치권과 일부 언론은 ‘요즘 MZ세대들은…’ ‘요즘 이대남(20대 남성)들은…’ 어쩌고 하면서 ‘공정과 상식’이 마치 젊은 층의 시대정신인 것처럼 말한다. 그런데, 사실 공정과 상식은 시대를 불문하고 중요하게 여겨지는 가치다. 딱히…"}, {"x": 14.444, "y": -0.748, "c": 6, "e": "e1", "t": "어쩌다가 20대의 시대정신이 ‘공정’이 되었을까? 트리거는 ‘인국공’이었다. 네이버 트렌드에서 ‘공정’을 검색해보면 2016년 1월부터 글을 쓰고 있는 지금 2023년 1월까지, 공정이라는 단어가 검색된 빈도 데이터를 분석해준다. 그 결과 2020년 9월경에 ‘공정’이라는 키워드가 해당 기간 중 가장 많이 검색되었다는 사실을 알 수 있었다. 2020년 9월을 휩쓸었던 이슈는 인천국제공항…"}, {"x": 14.177, "y": -0.481, "c": 6, "e": "e1", "t": "과연 인국공 사태를 통해 우리 사회는 ‘공정’이라는 담론을 하나의 지점으로 수렴시킬 수 있었는가. 인국공 사태로 촉발된 ‘공정 담론’의 주안점은 ‘절차적 공정’에 있다. 돈과 명예 등을 성취하기 위해서는 시험을 통과하는 것과 같은 ‘자격’이 필요하다는 것에 많은 이들이 동의했기 때문에 ‘공정’이라는 캐치프레이즈가 탄생할 수 있었다. 하지만 이러한 ‘절차적 공정’은 ‘공정’이라는 가치가…"}, {"x": 14.301, "y": -0.618, "c": 6, "e": "e1", "t": "비정규직의 정규직화는 많은 쟁점을 포괄하고 있다. 그러나 이를 ‘절차적 공정’의 문제로 승화해낸 정치권과 언론은 분명 반성해야 할 지점이 있다. 인천국제공항공사에 현실적으로 지원하고 합격할 수 있는 청년의 비율은 얼마나 되는가? 인국공 사태에 세대 담론을 적용해서 ‘절차적 공정’을 강조함으로써 ‘동등한 기회의 보장만으로 공정한 출발선을 얻을 수 없는 이들’에 대한 이야기는 오히려 소외된…"}, {"x": 14.153, "y": -0.488, "c": 6, "e": "e1", "t": "세상에는 우리가 무엇을 상상하든 그 이상의 ‘삶의 결’이라는 것이 존재한다. 하지만 여론과 민의는 그런 삶의 결들을 모두 반영할 수는 없다. 시대의 흐름을 읽는 데에 여론조사를 활용하는 것을 나쁘다고 말하려는 것이 아니다. 여론을 해석하고 이를 하나의 메시지로 만드는 과정에서 생겨날 수 있는 의도치 않은 그림자를 살펴볼 필요가 있다는 것이다. ‘공정’ 담론이 가져온 ‘절차적 공정’의…"}, {"x": 13.458, "y": -0.319, "c": 6, "e": "e1", "t": "소수의 입장이 정치적으로 과대 대표될 이유도 없으며, 다수의 사람이 정치적으로 과소 대표될 명분도 없다. ‘좋은 직장을 가지고 싶어 하는 열망’은 누구에게나 있지만, ‘모두가 좋은 직장을 가질 수는 없는 현실’을 인정할 수밖에 없다. 그렇기에 어떤 한 사건으로 인해 형성된 여론을 모든 시민들이 맞닥뜨리게 된 현실적 문제로 치환하는 것은 위험할 수 있다는 점을 잊어서는 안 된다. 특히 그…"}, {"x": 8.669, "y": -1.137, "c": 4, "e": "e1", "t": "사람에게 기계적 중립을 강요하는 것은 가혹하다. 하지만 ‘어느 정도’의 중립은 가능할 수 있다. 그 중립을 규정하는 방법이 사람마다 다르겠지만. 대상에 따라, 맥락에 따라 사람들은 자신들의 스탠스를 바꿀 수 있다. 하지만 기계적 중립은 대화의 맥락과 발언자의 사회적 배경에 의해서 무너질 수 있다. 아무리 발화자가 자신의 주장은 ‘중립적’이라고 주장할지언정, 듣는 이가 생각했을 때 그 발언은…"}, {"x": 9.767, "y": 1.008, "c": 9, "e": "e1", "t": "이태원 참사가 일어나고 며칠 뒤 일어났던, 별로 되새기고 싶지도 않은 정부 관계자들의 발언은 나로 하여금 ‘언어를 선점하는 것’이 권력을 유지하고 존속하는 데에 얼마나 중요한 것인지 다시금 깨닫게 해주었다. 굳이 그럴 필요는 전혀 없었지만. 행정안전부 사회재난대응정책관의 브리핑 중 발언을 보자."}, {"x": 8.826, "y": -0.934, "c": 4, "e": "e1", "t": "중립은 단순히 어휘의 선택만으로 달성될 수 있는 요건이 아니다. 발화의 맥락과 화자의 배경 등 수많은 요소가 듣는 이에 의해 고려되며, 이 모든 변수를 통제하면서 듣는 이로 하여금 ‘중립을 지켰다’고 납득시키는 것은 정말 어려운 일이다. 그렇기에 ‘나는 중립적이다’라고 주장하는 것이 때로는 듣는 이에게 굉장히 공허한 말처럼 느껴질 수 있음을 잊어서는 안된다. 혹자는 ‘완전한 중립을 지키는…"}, {"x": 11.752, "y": 0.56, "c": 6, "e": "e1", "t": "사건을 정치적으로 이용하지 말라고 이야기하는 사람들은 꽤 많다. 대체 어쩌다 이 지경이 됐나 싶을 만큼 의아하다. 어떤 사실은 의도와 상관없이 정치적인 이해관계에 투영될 수 있다. 하지만 말하는 이를 둘러싼 배경이 듣는 이로 하여금 ‘정치적 맥락’을 불러일으키는 경우가 있다. 이런 경우, 상대방에게 ‘당신, 이 사건을 정치적으로 활용하지 말라’고 요구하는 것은 높은 확률로 말하는 이와 듣는…"}, {"x": 12.086, "y": 0.287, "c": 6, "e": "e1", "t": "우리는 ‘정치적으로 활용하지 말라’는 블랙홀에서 어떻게 벗어날 수 있을까. 사회과학에서 어떤 사건은 자연과학에서처럼 두 물질을 섞는다고 ‘펑’ 터지지 않는다. 그 메커니즘이 쉽게 눈에 띄지도 않을뿐더러 사건에 개입된 사람들의 이해관계는 도저히 풀 수 없을 것만 같은 실타래처럼 꼬여 있다. 그것을 단순히 ‘검찰 수사’ 혹은 ‘경찰 조사’로 찾아내고자 하는 것은 굉장히 섣부른 시도일 수 있다.…"}, {"x": 11.931, "y": 0.192, "c": 6, "e": "e1", "t": "하지만 여기에는 허점이 있다. 수사는 ‘법적 책임소재’를 찾아내는 것을 목표로 한다. 다른 관점에서 바라보면, 수사를 받을 사람들은 ‘법적 책임’을 회피하기 위해 당장 검경이 들이닥쳐도 이를 빠져나갈 법적 구멍만 있으면 된다고 생각하는 것이다. 이는 수사로는 찾기 힘든 ‘구조적 그림자’를 은폐하는 흐름으로 이어질 수 있다. 즉, 사건이 발생했을 때 ‘법적으로 책임지기’를 피하고자 법의…"}, {"x": 12.081, "y": 0.315, "c": 6, "e": "e1", "t": "사건을 조사하는 과정에서 꼬여있는 실타래를 풀지 못할 수도 있다. 하지만 그 실수를 반복해서는 안 된다. 사건의 원인을 규명하기 위해 ‘법적 책임’에 초점을 맞춘다면 미처 발견할 수 없었던 ‘사건이 발생할 수밖에 없었던 구조’를 외면할 수 있다. 이런 구조는 윗사람보다는 아랫사람이 책임지는 구조를 만들게 된다. 여기에 ‘정치적으로 활용하지 말라’는 레토릭이 가미된다면 사건 조사는 어쩌면…"}, {"x": 11.92, "y": -0.018, "c": 6, "e": "e1", "t": "높은 자리는 그만큼 높은 책임을 요구하는 자리임을 상기할 필요가 있다. 법적 책임만을 묻기 위한 수사는 높은 자리보다는 낮은 자리를 겨냥하게 만들게 되며, 이런 ‘구조’를 또다시 만들어내는 악순환으로 이어진다. 법적 책임을 묻는 것이 결코 ‘사건 종결’이자 ‘정답’이 되어서는 안 되는 이유다."}, {"x": 10.86, "y": -3.573, "c": 7, "e": "e1", "t": "호의가 반복되면 권리인 줄 안다는, 이른바 온라인 냉소주의자들이 아무렇게나 툭툭 내뱉고 다니는 문장이 있다. 마치 이렇게 말하면 자신이 ‘호의를 권리인 줄 아는 사람들’과 구별되는 우월한 사람인 줄 아는 것 같은 느낌이 든다. 그런데 이런 이야기를 하는 사람들은 드물다. 노약자에게 자리를 양보하고, 어려운 가정에서 태어난 아이들에게 복지 재원을 투입하는 것을 ‘배려’라는 레토릭으로…"}, {"x": 10.876, "y": -3.67, "c": 7, "e": "e1", "t": "얼마 전 정치철학자 박이대승 씨의 글을 보다가 생각해 볼만 한 지점을 발견했다. 글의 내용을 대충 요약하자면, ‘배려’ 따위의 용어로 포장되는 행위들은 사실 국가와 시민이 당연히 행해야 할 의무인데, 이런 의무를 마치 “큰 선심 쓰듯이”, 혹은 “불우이웃 돕기 하듯이” 행한다는 점에 불만을 제기하는 것이었다. 어쩌면 지극히 당연한 이야기일지도 모른다. 하지만 일반인의 상식선에서 ‘모든…"}, {"x": 10.913, "y": -3.646, "c": 7, "e": "e1", "t": "왜 굳이 ‘배려’로 규정된 우리들의 선의를 부정하려 드냐고 의문을 제기할 수도 있다. 선의에 기반한 동정심을 부정하려 들지는 않겠다. 하지만 동정심에 기반한 행동은 필연적으로 시혜적 시선에서 비롯한 관계의 수직적 설정을 방조한다. 선천적, 후천적 약자들의 기본권을 보장하기 위한 국가와 시민사회의 지원을 ‘동정심에 기인한 배려’와 ‘시혜적 시선’의 관점에서 해석한다면 이는 훗날 논쟁의 대상이…"}, {"x": 11.095, "y": -3.465, "c": 7, "e": "e1", "t": "평평한 곳에서 물은 사방으로 흐른다. 하지만 기울어진 곳에서 물은 위에서 아래로만 흐른다. 아래에서 위로 물이 흐를 수는 없지 않은가. 배려와 시혜적 시선 또한 마찬가지다. 배려와 시혜적 시선은 ‘기울어진 관계’를 만들고, 이런 인식에 기반한 국가와 시민사회의 도움은 방향성을 잊은 논쟁으로 이어질 수 있다. ‘약자’라는 명사로 집단을 타자화하고 ‘강자’와 ‘약자’를 구분한다. 이런 수직적…"}, {"x": 10.948, "y": -3.335, "c": 7, "e": "e1", "t": "문제는 이런 시도가 여론을 등에 업을 때다. 여론이라는 괴물을 멈춰 세울 수 있는 것은 국민뿐이다. 그렇기에 누구보다 ‘떼법’을 혐오하는 이들이 또 다른 차원에서의 ‘떼법’을 등에 업고 상대를 물어뜯는 악순환은 막아야 하지 않겠는가. 가령, ‘약자 코스프레’라는 프레이밍을 시도하는 이들은 자신들을 ‘떼법’과는 거리가 먼, 자유민주주의자라고 믿는 것만 같다. 모든 것을 법과 원칙대로 하자는…"}, {"x": 10.943, "y": -3.622, "c": 7, "e": "e1", "t": "분명히 오해하지 말아야 할 부분은, ‘배려’라는 용어에서 기인한 시혜적 시선을 거두자는 것이지 소수자와 약자가 인간으로서 ‘당연히’ 누려야 할 존엄성과 권리를 수호하기 위한 국가와 시민사회의 지원마저 박탈하자는 이야기가 아니다. 대한민국 헌법이 존재하는 한, 이들은 ‘당연히’ 국가로부터의 보살핌을 받아야 한다."}, {"x": 10.844, "y": -3.074, "c": 7, "e": "e1", "t": "법치주의와 민주주의 아래에서 우리가 더 나은 삶을 위해 고민하고 행동해야 할 대상은 제도와 정치다. 복지 사각지대에서 국가의 도움을 받지 못하는 사람을 찾아내고 부족한 것이 있으면 보완을 요구하는 것이 순리다. 특정 계층, 특정 집단 전체가 ‘약자 코스프레’를 하고 있다고 비난하고 헐뜯어서 나아지는 것은 아무것도 없다. ‘약자 코스프레’라는 레토릭은 상수를 건드리지 못한 채 변수만…"}, {"x": 9.623, "y": 1.41, "c": 9, "e": "e1", "t": "사회적 맥락을 가진 언어는 언제나 불완전하다. 그렇기 때문에 사회적 맥락 속에서의 언어 비판 또한 불완전할 수밖에 없다. 비판에 동원되는 언어 또한 사회적 맥락에서 발화되기 때문이다. 그러나 이 불완전한 언어 속에서 중심까지 잃을 필요는 없다. 눈에 보이지 않는 사회 구조를 만들어내는 몇 개의 축 중에서 언어는 매우 큰 역할을 하고 있기 때문이다. 공론장에서의 언어를 비판 없이 수용한다면…"}, {"x": 14.432, "y": 1.673, "c": 3, "e": "e2", "t": "대한민국 헌법 제7조제1항. 공무원은 국민 전체에 대한 봉사자이며, 국민에 대하여 책임을 진다. 그런데, 권력자에 의해 ‘봉사’의 의미가 한참 곡해되고 있는 느낌이 든다. 돈을 적게 받고 일해도 ‘국민을 섬기는 공직자’이어야 하기 때문에 제대로 된 보수를 받지 않아도 참아야 한다는 것이다. 나중에 연금도 나오고, 웬만해서는 직업 안정성이 보장되는 직업이기 때문에 공무원은 ‘사명감’을 갖고…"}, {"x": 13.911, "y": 1.406, "c": 3, "e": "e2", "t": "사실 모든 민원인들이 구청이나 주민센터를 직접 방문해서 민원을 처리하지는 않는다. 민원창구에서만 처리 가능한 몇몇 민원을 제외하고는 거의 모든 민원이 온라인이나 모바일로 처리가 가능한 시대기 때문이다. 그렇다면, ‘온라인이나 모바일로 민원을 처리하기 쉬우면 세금 축내는 공무원 숫자 줄여도 되는 것 아닌가?’라는 생각을 할 수도 있겠다."}, {"x": 14.228, "y": 1.501, "c": 3, "e": "e2", "t": "헌법에 규정된 ‘국민 전체에 대한 봉사자성’을 폭언과 악성민원을 정당화하기 위한 법적 근거로 곡해해서는 안된다. 공무원이 고의 없는 과실을 저질렀다고 해서 ‘내 세금으로 먹고 사는 것들이 일 똑바로 안해?’ 라고 민원인이 말하는 것은 비약이라는 것이다. 대한민국 국민으로서의 주권은 ‘세금을 내기 때문’에 주어지지만은 않는다. 대한민국은 형편이 좋지 않다고 해서 세금 내지 않는 사람들의…"}, {"x": 14.007, "y": 1.587, "c": 3, "e": "e2", "t": "악성민원인의 가장 큰 논리적 흠결은, ‘세금으로 먹고사니즘’을 일선 구청과 주민센터 공무원 앞에서 당당하게 내뱉는다는 점에 있다. 여러분 앞에서 민원을 처리하는 공무원들의 태도가 불손하다고 해도, 그들에게 ‘내 세금받고 일하니 태도 똑바로 해라’는 조언을 하는 것은 논리적 오류다. ‘공무원의 태도가 불손한 것’과 ‘공무원이 국민의 세금으로 먹고사는 것’ 사이에는 어떠한 상관관계도 없다.…"}, {"x": 13.904, "y": 1.101, "c": 3, "e": "e2", "t": "민원대에 앉아본 적이 있는가? 생전 본 적도 없는 사람이 대뜸 찾아와서 이것저것 해달라는 요청을 처리하고 또다시 새로운 사람을 맞는 그 일 말이다. 민원대의 파열음은 일상 속에서 시작된다. 때론 터무니없는 거짓말이, 때론 그 누구도 나를 살펴주지 못했다는 서러움이 민원대의 일상을 뒤흔든다. “나이프 들고 와서 다 찌르겠다” “신나 들이붓고 라이터 놓으면 너네 다 끝이야” “오늘 저녁에 약…"}, {"x": 14.128, "y": 1.357, "c": 3, "e": "e2", "t": "행정안전부의 자료에 따르면 민원인의 위법행위는 2018년 3만 4484건, 2019년 3만 8054건, 2020년 4만 6079건, 2021년 5만 1883건으로 늘었다. 그렇지만 기관 차원에서의 법적 대응은 12건에 불과했다. 게다가, 공공기관에서 근무해 보았다면 알 수 있지만, 민원인의 위법행위가 상부에 보고될 정도라면 ‘일상적인 악성민원인의 해프닝’ 정도는 보고된 건수보다 몇 배는…"}, {"x": 14.167, "y": 1.493, "c": 3, "e": "e2", "t": "막무가내 민원은 악성 민원의 다른 이름이자 악성민원의 본질을 가장 잘 드러내고 있는 표현이다. 권남옥은 “지방행정공무원의 감정노동 적응에 대한 근거이론 연구”에서 막무가내의 요구를 하는 민원인을 상대할 때 공무원의 회피성향이 발현될 수밖에 없다는 점을 지적한다."}, {"x": 14.013, "y": 1.648, "c": 3, "e": "e2", "t": "권남옥은 연구의 결론에서 연구에 참여한 공무원들이 “대민업무과정 중에 일관되고 친절한 행정서비스를 제공하도록 요구하는 조직문화 속에서, 악성민원을 포함한 다양한 민원인의 광범위한 질의와 요구에 부응하는 것에 부담감을 느꼈다”는 점을 언급한다. 무리한 요구를 친절하게 대응할 수 있다면 가장 좋겠지만, 그게 보통 쉬운 일인가? 친절하게 막무가내 민원을 응대하라는 것만큼 어이없는 요구가 없다.…"}, {"x": 14.21, "y": 1.663, "c": 3, "e": "e2", "t": "무리한 요구에 공무원이 단호하게 대응했을 때 제기되는 민원을 해당 공무원이 아닌 조직과 관리자가 소화하는 시스템을 만들고, 악성민원인에 노출된 공무원에게 치료를 위한 시간과 지원을 아끼지 않는 것 또한 필요하다. 하지만 무엇보다 중요한 것은 일선 공무원이 민원을 받았다는 이유만으로 해당 공무원이나 상급자에게 인사상 불이익이 발생하거나 조직 내 평판에 영향을 줄 수 있는 분위기가 변화되어야…"}, {"x": 13.952, "y": 2.747, "c": 3, "e": "e2", "t": "국방의 의무를 수행하는 사회복무요원들 사이에서도 이른바 근무 강도가 높고 민원 응대가 힘든 곳으로 유명한 곳들이 있다. 공공도서관도 일반적으로 ‘헬무지’로 여겨지곤 한다. 사실 공공도서관에 근무하는 사서직은 다른 직렬보다 쉬운 것 아닌가 하는 의문을 제기할 수 있지만, 현실은 그렇지 않다. 남들 다 쉬는 주말에 하루를 출근하는 대신, 월요일에 휴식을 부여받으면서 이틀 연달아 푹 쉬기도…"}, {"x": 13.969, "y": 2.664, "c": 3, "e": "e2", "t": "그렇다고 돈을 많이 받는가? 놀랍게도 전혀 그렇지 않다. 공무원 직급상 6급 이하 기준 사서수당은 단돈 월 2만원이다. 나머지 급여체계는 타 직렬 공무원과 완전히 동일하게 적용된다. 더군다나 현대의 공공도서관은 생각보다 많은 일을 한다. 다른 공공주체에 문화예술 프로그램을 운영할 공간을 제공하기도 하고, 도서관 자체 교육 프로그램을 기획하고 운영하는 역할도 맡는다. 이용자의 수요가 많을 것…"}, {"x": 13.817, "y": 2.998, "c": 3, "e": "e2", "t": "지역을 불문하고 도서관 건립 혹은 재건축은 정치인의 주요 공약들 중 하나다. 멋진 도서관이 자신의 지역에 들어오면 지역의 가치를 높일 수 있다고 판단하기 때문이다. 그런데 그냥 공약을 던져놓기만 하고 운영에 들어가는 비용은 아까운가 보다. 김효윤은 “도서관법 개정에 따른 공공도서관 설립 타당성 사전평가의 실효성 분석”이라는 연구에서 다음과 같은 사항을 지적한다."}, {"x": 13.912, "y": 2.909, "c": 3, "e": "e2", "t": "또한 김효윤은 1184개의 공공도서관 중 법정 최소 사서 수인 3명조차 확보되지 않은 채로 운영 중인 도서관이 34.2%에 달한다는 사실을 지적한다. 물론, 도서관법 시행령에 기대어 적정 사서 수를 산출하는 것에 대한 현실적 한계가 존재하기도 한다. 이를 감안해 문체부 도서관정책기획단이 공공도서관 건립 및 운영 컨설팅에 나설 때도 도서관법 시행령과 함께 법정사서평균배치율을 활용하여 최소…"}, {"x": 13.828, "y": 3.04, "c": 3, "e": "e2", "t": "효율의 극대화와 비용의 최소화만을 추구하는 시대정신 속에서 ‘수익을 낼 수 없는’ 도서관은 애들 공부방 역할이나 똑바로 해라는 비아냥이나 듣고 있다. 그러나 도서관은 엄연히 ‘도서관법’이라는 법률에 의해 설립된 국가기반시설이다. 공공도서관 설립 타당성 사전평가, 도서관 운영 및 인력에 관한 규칙 등 엄연히 ‘도서관’을 운영할 법적 근거와 검토기구 또한 존재한다. 법에서 규정하고 있는 만큼…"}, {"x": 11.222, "y": -0.58, "c": 6, "e": "e2", "t": "사실 이런 글 쓰고도 세상의 변화를 기대하지는 않는다. 또 누가 죽어야 호들갑 떨면서 오만 사람들이 관심 가질 게 뻔하기 때문이다. 그런데 그렇다고 ‘구조’를 고치는 시도를 할 것인가? 시스템에 희생된 사람들을 추모하는 사람들과 ‘추모하지 말 것’을 요구하는 이들이 대립하고, 극단적인 사례들 몇 개를 자극적으로 보도하는 기사가 쏟아질 것이다. 쿨찐의 감성에 찌든 이들이 ‘중립기어’를 외칠…"}, {"x": 14.069, "y": 2.108, "c": 3, "e": "e2", "t": "정치인들과 관리자들은 왜 젊은 공무원들이 일터를 떠나려 하는지 고민하는 흔적조차 보이지 않는다. 아직도 봉사자성을 강조하며 ‘점심시간 휴무제’마저 폐지하라는 정치인이 목소리를 높이고 있으며, 공공 분야일수록 더더욱 허리띠를 졸라매야 한다는 기괴한 목표 탓에 폭염 속 격무에 시달리는 공무원은 근무 외 시간에는 에어컨도 틀지 못하는 것이 이 나라 공공의 현실이다. 신규 9급 공무원의…"}, {"x": 11.726, "y": -0.059, "c": 6, "e": "e2", "t": "누칼협과 알빠노의 시대정신, 그리고 중립기어라는 레토릭은 그 어떤 방식으로도 현실을 개선할 수 없다. 단 한 명의 피해자도 없는 완벽한 구조를 만드는 것은 불가능하다. 그러나, 또한 우리가 만들어갈 구조의 지향점은 ‘단 한 명의 피해자도 없는 완벽한 구조’여야만 한다. 사용자와 관리자가 아무리 노력해도 불의에 의해 발생하는 사고는 어쩔 수 없다는 마음가짐은 비관적 현실주의라기보다는…"}, {"x": 10.723, "y": -0.691, "c": 6, "e": "e2", "t": "판단과 진단에 중독된 사회에서 회의주의의 목소리는 갈수록 커진다. 남을 돕는 타인의 행동을 선해하기보다는 어떤 대가를 바라고 행동하는 것이 아닌지 하는 의구심이 사회를 잠식해 나갈 때 공동체는 형해화된다. 가만히 있으면 중간이라도 가는 사회에서는 악폐습의 재생산이 멈추는 것을 기대하기 어렵다. 그래서 대체 어디서부터 무엇이 잘못되었는지 감히 진단하는 것조차 버겁게 느껴지는 오늘날이다.…"}, {"x": 8.848, "y": 0.605, "c": 10, "e": "e3", "t": "모두가 AI! 4차 산업혁명!을 외칠 때, 누군가는 그 목소리에 태클을 걸 필요가 있다고 느꼈다. 권력자들과 미디어는 ‘AI가 우리나라의 미래 먹거리’라고 말하고 다니며 그 전문인력 양성에 대한 목소리를 높여 왔다. 그들의 말만 들으면 AI는 무엇이든 척척 해낼 수 있는 만능 요술봉과 다름없다. 그런데, 정말 AI는 무해한가? 유튜브 알고리즘, ChatGPT 등등, 많은 일상을 기계학습이…"}, {"x": 8.121, "y": 0.268, "c": -1, "e": "e3", "t": "필터버블 현상이라는 용어가 있다. 온라인의 정보 제공자가 정보 이용자가 좋아할 법한 내용을 걸러서 보여줌으로써 이용자의 편의를 증진함과 동시에 다른 정보에 노출을 제한하는 현상을 일컫는다. 특히 유튜브 알고리즘의 필터버블 현상을 다룬 연구는 더러 있다. “보수 계정에서는 보수 성향의 영상이 더욱 추천되고 진보 계정에서는 진보 성향의 영상이 더욱 추천”된다는 신유진의 연구 결론은, 어쩌면…"}, {"x": 8.241, "y": 0.368, "c": -1, "e": "e3", "t": "알고리즘이 나쁜 방향으로 작동하기 위해서는 크게 두 가지 경우의 수가 있다. 하나는 알고리즘에 대한 관리감독이 전혀 이뤄지지 않는 경우, 또 다른 하나는 유해하거나 거짓 정보를 담고 있는 컨텐츠가 갈수록 교묘하고 구별하기 어려워지는 경우다. 축구선수 이강인의 파리생제르맹 이적설이 파다할 때, 한 유튜브 쇼츠 영상의 조회수가 1100만 회를 넘겼다. 파리생제르맹의 간판 스타 킬리안 음바페가…"}, {"x": 8.162, "y": 0.443, "c": -1, "e": "e3", "t": "한편, 권력자가 임명한 공직자 중 한 명이, 자신이 운영하던 구독자 21만 명 규모의 유튜브 채널을 폐쇄하고 인사청문회에 임했다는 사실을 접했다. 미디어가 보도한 해당 유튜브 채널 컨텐츠의 면면에 대해서 굳이 언급하는 것은 꽤 피곤한 일이니, 구체적으로 열거하진 않겠다. 허나, 분명한 것은 정치적 소재를 다룸으로써 어떤 ‘인사이트’를 제공했고, 그것이 알고리즘의 파도에 올라타기 매우…"}, {"x": 8.109, "y": 0.437, "c": -1, "e": "e3", "t": "알고리즘의 존재를 의식하는 사람들은 알고리즘을 이용해서 원하는 정보를 선택하고, 더 나아가 수익을 얻기까지 한다. 하지만 알고리즘의 존재를 의식하지 못하는 정보 이용자라면, 알고리즘의 파도에 몸을 맡기는 것이 정말 이로운 일일지 고민할 필요는 있다. 더욱 강력한 확증편향 기제로 작동하는 알고리즘은 독이 든 성배가 될 수 있다는 것이다. 최소한 정보 검색에 있어서 선택과 은폐는 양립가능하기…"}, {"x": 9.452, "y": 0.195, "c": 10, "e": "e3", "t": "불문율을 학습하는 방법으로 AI는 ‘불문율 이외의 데이터를 학습하기’라는 기묘한 대안을 제시한다. 가령 ‘연세대 대학원생은 청경관에서 학식을 먹으면 안 된다’는 불문율이 존재한다고 치자. 온라인 공간에 이런 불문율에 대한 정보를 일절 얻을 수 없는 상황을 가정할 때, AI는 불문율을 어떤 방식으로 학습할 수 있을까. 청경관에서 결제한 카드의 소유주 중에 대학원생이 없거나, 혹은 얼굴인식…"}, {"x": 9.438, "y": 0.228, "c": 10, "e": "e3", "t": "사실, ‘청경관 불문율’이 많은 연세대 대학원생 사이에 공유될 정도가 된다면, 온라인 공간에서의 언급 또한 늘어날 것이며 AI가 그 존재를 알아차리는 데에는 큰 시간이 걸리지 않을지도 모른다. 그리고 딥러닝 모델의 일반화 성능을 평가하는 잣대 또한 연구자마다, 방법론마다 차이를 보일 수 있기 때문에 불문율을 추론해 냄에 있어서 ‘100% 정확한 예측력’을 보이는 기계학습 모델을 요구하는…"}, {"x": 9.437, "y": -0.021, "c": 10, "e": "e3", "t": "그럼에도 불구하고, ‘청경관 불문율’은 그나마 AI가 학습하기 쉬운 예시일 수 있다는 점도 고려해 볼 만하다. 불문율을 추론해 내기 위한 데이터들의 차원도 복잡하지 않으며 추론을 위한 회귀식을 구성할 변수 또한 사람들이 직관적으로 이해할 수 있기 때문이다. 그런데, 인간 세상에 굴러다니는 이야기들의 층위는 상상 그 이상으로 복잡하다. 같은 사건을 두고 그것을 바라보고 해석하는 방법이…"}, {"x": 9.331, "y": -0.493, "c": -1, "e": "e3", "t": "인간의 내러티브는 우리가 상상하는 그 이상으로 복잡하게 얽혀 있다. 가령, 우리가 ‘나와 A라는 사람의 관계’를 단편적으로 떠올릴 때 ‘나와 A는 사이가 좋지 않다’라는 사실을 나의 친구들이 받아들이는 방식에 따라서 ‘나와 A의 관계’는 수없이 많은 방식으로 정의되고 해석된다. 이를 조금 더 넓은 차원에서 바라보면, 인간과 인간 사이의 관계를 정의하는 방식은 사람들이 서로를 바라보는 시선에…"}, {"x": 10.435, "y": 0.306, "c": 10, "e": "e3", "t": "혹자는 불문율을 어떻게든 학습할 수 있지 않으냐고 반박할 수 있는데, 사실 그런 식의 반문에 대해 제대로 답할 사람은 아무도 없다. ‘어떻게든’이라는 극단적인 표현을 써가면서까지 인공지능의 무궁-무진한 잠재력을 기대하는 이들을 설득할 방법은 없다. 그러나, 자연어처리를 통해 댓글, 커뮤니티 등 온라인 공간의 반응을 학습시킬 수 있지만, 이를 자연어처리 모델이 학습하는 것이 과연 바람직한지…"}, {"x": 10.596, "y": 0.405, "c": 10, "e": "e3", "t": "발상의 전환이 필요하다. 익명성을 보장하는 온라인 공간에서의 발언이 ‘자유’를 바탕으로 이뤄진 것이기 때문에 그 자체로 기계학습의 가치가 충분하다는 주장은 ‘자유’의 그림자를 전혀 톺아보지 않은 매우 위험한 시도일 수 있다. 온라인 공간에서 이뤄지는 대화의 대다수는 오프라인 공간에서 발화되지 않는다. 그만큼 온라인 공간을 떠도는 어휘와 표현은 극단으로 치우쳐 있다는 것이다. 즉, 온라인…"}, {"x": 9.897, "y": 0.439, "c": 10, "e": "e3", "t": "생성형 AI의 작동을 위해서는 모델을 학습시킬 데이터가 필요하다. 생성형 AI가 먹고 자라는 데이터는 자연어의 형태로 존재한다. 그런데 온라인의 데이터가 우리가 생성해 내는 ‘자연어’의 전체라고 생각하면 오산이다. 우리는 비문 덩어리의 문장을 매일 남발한다. 자연어로 처리되지 않은 ‘문장’은 기계가 학습할 수 없다. 온라인의 언어는 전처리를 통해 기계가 학습할 수 있을 단계까지 정제할 수…"}, {"x": 10.116, "y": 0.238, "c": 10, "e": "e3", "t": "자연어처리를 통한 텍스트 분석은 분명 사회과학 연구자들에게 획기적인 인사이트를 가져다줄 수 있는 양적 연구방법론이 맞다. 하지만 이 분야를 계속 공부하고 실습하면서 느끼는 점은, 최소한 사회과학의 관점에서 자연어처리가 과연 ‘가설에 대한 근거를 제시하는 연구방법론’ 그 이상의 역할을 수행할 수 있냐는 것이다. 더군다나 자연어처리의 궁극적 한계는 명문화된 텍스트만을 다룬다는 점에 있다.…"}, {"x": 10.507, "y": 0.072, "c": 10, "e": "e3", "t": "사회과학의 본질은 구조가 드리운 그림자를 걷어내는 것에 있다고 생각한다. 아니, 어쩌면 사회과학의 본질이 아니라 학문의 본질일지도 모른다. 그리고, 그림자를 없애는 가장 좋은 방법은 그림자가 드리운 공간에 빛을 비추는 것이 아니라, 그림자를 만들어 낸 거대한 구조를 ‘붕괴’시키는 것에 있다. 그래서 하나의 방법론에 몰입하는 것은 생각보다 더 위험할 수 있다는 사실이 피부에 와닿는…"}, {"x": 9.15, "y": 0.592, "c": 10, "e": "e3", "t": "뿐만 아니라, 무책임한 권력자들의 AI 맹신은 그들이 그토록 사랑해 온 법과 원칙을 무너뜨릴 수 있다. 법무법인 광장의 2023년 4월 뉴스레터 ‘ChatGPT와 관련한 지식재산권 이슈 및 시사점’에 따르면, “언어 모델의 학습 과정에서 웹 스크래핑을 통해 온라인에서 정보를 수집할 때” 저작권법 및 부정경쟁방지 및 영업비밀보호에 관한 법률에 저촉될 위험이 있음을 경고하고 있다. 또한…"}, {"x": 9.159, "y": 0.697, "c": 10, "e": "e3", "t": "모든 문학가와 글쟁이는 저작권에 대한 규제를 더욱 강화하고 AI의 기계학습에 더욱 강경히 대응할 것을 제안한다. 글 한 편에 숨 쉬는 작가의 영혼이 자본가들의 손아귀에 있는 AI의 학습 대상이 될 이유는 없다. 글쟁이들이 무서워해야 할 것은 AI 가 아니라 이 틈을 타 저작권 규제를 풀어보려고 하는 자본가들과 지대추구자들이다. 능력주의라는 가면을 쓴, 지대추구라는 뼈다귀뿐인 자본주의…"}, {"x": 9.308, "y": 0.58, "c": 10, "e": "e3", "t": "보다 더 ‘예쁜’ 기계학습 모델을 만들기 위한 과정에서 ‘제거’될 만한 아웃라이어(이상치)들이 세상을 변화시켜 왔다. 세상을 바꿔온 힘은 정규분포 안에서 ‘일어날 법한 일’들이 아니었다. 문학과 사회가 가지는 창의성의 추세선을 기계학습에서 찾는 것에 물음표를 던져야 하는 근본적인 이유다. 보다 더 많은 사람들이 좋아하는 답을 내놓는 기계학습 모델은 이미 밝은 곳에 빛을 더 강력하게 비추고…"}, {"x": 9.488, "y": 0.887, "c": 9, "e": "e3", "t": "혹자는 ‘디지털 규범’을 만드는 것의 중요성을 언급한 적 있는 권력자의 발언을 근거로 권력자는 이미 책임을 다하고 있다고 주장할 수 있겠다. 그런데, 규범을 만들어 내는 주체가 권력과 자본임을 환기할 필요가 있다. 생성형 AI는 다른 곳도 아닌 지금의 사회 구조를 그대로 투영하고 있다. 인간 사회가 ‘윤리’라고 판단한 것들을 AI는 ‘윤리’로 대상화하며 인간들이 ‘진리’라고 여긴 가치들을…"}, {"x": 9.238, "y": 0.629, "c": 10, "e": "e3", "t": "기계학습은 평등하지 않다. 번역기가 만들어 낸 어휘의 모호함을 확인하고 이를 수정할 수 있는 능력은 더 소수에 집중될 것이다. 시간이 지날수록 기계학습은 정규분포 양 끝의 집단들을 더욱 강력하게 구분함과 동시에 은폐할 것이다. 예쁜 기계학습 모델은 ‘인간의 맘에 들 법한’ 달콤한 이야기들을 건넬 뿐, 빛이 비치지 않는 곳에서 더욱 강력한 힘을 추동하며 빛을 앗아갈 것이다. 한쪽으로 폭주하는…"}, {"x": 9.941, "y": -0.899, "c": 8, "e": "e4", "t": "사회과학은 자연법칙의 지배를 받지 않는다. 그래서 사회를 움직이는 모든 변수를 알고 있다고 가정할 수도 없으며, 특정 변인을 통제하여 인과관계를 추측해 보려 해도 그 추측을 현실이라고 ‘단정’할 수는 없다. 하지만 우리는 자주 눈에 보이는 몇몇 변수들만을 뭉뚱그려서 나와 너의 다름을 구별하려 드는 실수를 범한다. 이런 구별짓기는 다름을 틀림으로 만들고, 나와 다른 사람들 사이의 배타성을…"}, {"x": 12.93, "y": -2.778, "c": 12, "e": "e4", "t": "그러나, 남에게 존재하는 위험마저 ‘남의 것’으로 치부하고 선을 긋는다고 해서 그 위험이 ‘내 위험’이 되지 않으리란 보장은 없다. 여기서 위험이란 사람들의 사회경제적 지위를 위협하는 차원의 위험이 아니라, 인간의 존엄성과 목숨을 위협하는 차원의 위험을 의미한다. 이런 차원의 위험을 이 글에서는 ‘절박한 위험’이라고 표현하려 한다. 이런 ‘절박한 위험’은 원인을 직관적으로 파악하기…"}, {"x": 12.186, "y": -2.048, "c": 11, "e": "e4", "t": "대체로 ‘절박한 위험’은 불평등의 그늘 아래서 곪아간 채로 발견되곤 한다. 그래서 사람들은 ‘절박한 위험’을 끄집어내려 하지도 않고, 불평등의 그늘을 없애려 들지도 않는다. 당장 나와는 별 관련이 없어 보일뿐더러 세상 돌아가는 일에 관심을 꺼도 ‘당장의 일상’을 영위하는 데에 별 문제가 없기 때문이다. 그렇게 ‘불평등은 언제나 우리 곁에’ 남게 된다."}, {"x": 12.258, "y": -1.84, "c": 11, "e": "e4", "t": "불평등의 귀책 사유를 사회와 구조가 아니라 개인에게서 찾으며, 불평등이 거대해져 가는 것을 지켜보기만 한다. 하지만 불평등이 만들어낸 ‘절박한 위험’ 또한 ‘언제나 우리 곁에’서 거대해진다. 이 위험마저 ‘남의 것’으로 치부하려는 순간 ‘남의 위험’은 곧 나에게 다가오기 시작한다. 구조적 문제를 고쳤어야 한다는 목소리는 잊힌 채로 비로소 ‘나의 위험’이 되었을 때, 우리는 서로를 탓한다.…"}, {"x": 12.954, "y": -2.948, "c": 12, "e": "e4", "t": "한편, 돌봄과 노동은 생명이라는 필연과 연결되어 있다. 또한 돌봄과 노동은 시대를 막론하고 언제나 인간의 삶과 함께해 왔다. 따라서, 돌봄과 노동에서 존엄성이 사라질 때 비로소 우리는 위험을 직시할 수 있으며 이는 계층을 막론하고 누구에게든 위협이 될 수 있다. 그래서 이 글을 쓴다. 돌봄과 노동 현장에서의 위험을 직시하지 않고 공유하지 않으려 하며, 사회경제적으로 충격을 완화해 줄 만한…"}, {"x": 11.431, "y": -1.949, "c": 11, "e": "e4", "t": "영화는 단순히 ‘안락사를 지원하는 국가’를 다루는 것에 그치지 않는다. 호텔 청소 일을 하는 비정규직 78세 여성의 삶이 경제적으로 얼마나 불안정한지, 동시에 약해진 사회경제적 지위가 어떻게 삶을 ‘보잘것없는 상태’로 이끄는지 세세하게 그려낸다. 나이가 많다는 이유로 사는 곳에서 퇴거를 요구받고, 일자리를 구하려 해도 나이 때문에 거절당하는 그녀의 삶은 사회 구성원으로서의 존재 가치를…"}, {"x": 11.353, "y": -2.162, "c": 11, "e": "e4", "t": "[플랜 75]에서 나타난 문제의식처럼, 차라리 안락사를 선택하는 것이 낫겠다는 사회경제적 약자들의 목소리는 우리 사회에서 ‘고독사’의 형태로 실현되고 있다. 10년에 한 번 꼴로 거대한 경제위기를 맞는 21세기의 대한민국에서, 사회경제적 지위의 약화는 단순히 개인을 ‘먹고살기 힘들게’ 하는 결과로만 이어지지 않는다. 지난 2017년부터 2021년까지, 한국에서 고독사로 사망한 사람은 총…"}, {"x": 10.412, "y": -2.061, "c": 8, "e": "e4", "t": "한국보건사회연구원이 발간한 “2022년 고독사 예방 실태조사 연구 보고서”는 조사 대상 1인 가구의 22.4%가 고독사 중위험군 이상에 포함된다는 사실을 보여준다. 그런데, 고독사 중위험군 이상 범위에 포함되려면 설문조사에서 40점 이상의 점수를 받아야 하는데, 해당 설문조사에서 중위험군 이상 판단 기준은 다음과 같다."}, {"x": 11.682, "y": -2.585, "c": 11, "e": "e4", "t": "사실 앞서 언급한 정책들은 이미 시행되고 있다. 매년 수급비는 오르고 있고, 고독사를 확인할 수 있는 활동 감지 센서들이 끊임없이 개발되고 있다. 그런데, 정말 이런 조치들이 불평등을 해소하고 사회연결망을 회복하는 데에 도움이 될 수 있을까. 활동 감지 센서는 고독사를 예방하기보다는 확인하는 수단에 가깝다. 그리고, 수급비를 올린다고 사람들의 생계가 정말 나아질까? 주민센터에서 일하면서…"}, {"x": 11.92, "y": -2.704, "c": 11, "e": "e4", "t": "우리 사회는, 아니 어쩌면 인류는 수많은 불평등의 원인을 집단생활과 돌봄의 공유로 보완함으로써 지속할 수 있는 것일지도 모른다. 교육 수준에 따른 정보의 불평등을 공동체의 정보력이 메꾸고, 경제적 불평등으로 인해 발생하는 돌봄의 빈자리를 공동체 구성원이 메꿔주는 식으로 인간 사회는 불평등을 애써 무시하고 존속할 수 있었다. 하지만, 이제는 사회연결망이 무너지며 돌봄이 사라지고 있다. 이제…"}, {"x": 12.158, "y": -3.58, "c": 7, "e": "e4", "t": "이러한 돌봄의 부재를 해결하기 위한 국가와 민간의 노력은 대체로 ‘비용을 낮추는 것’에 초점을 맞추고 있다. 병원에서의 간병비 부담을 덜어주려고 하는 시도는 ‘비용을 낮춤으로써 돌봄 부담을 줄이려고 하는 시도’의 대표 격이라고 할 수 있다. 국민의힘은 2024년 총선 공약으로 ‘간병비 급여화’와 ‘간병비 연말정산 세액공제’ 정책을 들고나왔을 만큼 국민의 간병비 부담은 막대하다. 중앙일보의…"}, {"x": 11.996, "y": -3.709, "c": 7, "e": "e4", "t": "그런데 정말 간병비 부담을 낮추는 것이 장기적으로 국가와 사회가 받아들일 돌봄 부담을 줄이고 돌봄이 필요한 사람들의 존엄성을 확보할 방안이 될 수 있을까? 물론 지금 주어진 현실 아래에서, 간병비 인하 및 건강보험 급여화는 단기적으로 환자와 가족들에게 가장 도움이 될 만한 조치라는 것을 부정할 수는 없다. 하지만 동시에 우리는 국가에 ‘돌봄의 종착지가 요양병원이 되어버린 현실을 바꿀 수는…"}, {"x": 12.078, "y": -3.664, "c": 7, "e": "e4", "t": "약사이자 칼럼니스트인 박한슬 작가는 <주간조선> 기고에서 요양병원 장기 입원에 관한 문제에 대해서 “요양병원에 181일 이상 입원한 장기 입원 환자의 비율은 평균 49.1%”에 달한다는 사실을 언급하며, 대부분의 장기 입원 환자가 치료가 불가능한 치매와 노쇠 등의 만성질환을 앓고 있다는 점을 지적한다. 하지만 대가족의 해체로 인해 가정 내 돌봄이 힘들어졌고, 이런 현실 때문에 입원해야 할…"}, {"x": 11.971, "y": -3.531, "c": 7, "e": "e4", "t": "사실, 사회복지의 일선에서 흔히 보이는 요양보호사와 생활지원사들이 지역사회에서 활동하면서 어느 정도 돌봄 수요를 메꿔주고 있긴 하다. 하지만 하루에 여러 돌봄 수요자의 가정을 방문해 집안일을 하고, 가족이라도 하기 힘든 수발까지 들어주면서도 이들의 임금은 월 250만 원을 넘지 못한다. 그러다 보니 요양보호사 자격이 있어도 힘들어서 일을 관두기 십상이고, 당연히 장기적으로 이런 형태의…"}, {"x": 11.986, "y": -3.719, "c": 7, "e": "e4", "t": "박한슬 작가가 언급한 것처럼, 장기적으로는 지역사회가 돌봄의 부담을 함께 분담하고, 사회경제적 위기가 닥칠 때마다 서서히 늘어나는 돌봄 수요를 감당할 수 있는 장기적이고 안정적인 돌봄 인프라를 갖출 필요가 있다. 치매와 같은 치료가 불가능한 만성 질환을 앓는 사람들의 돌봄 수요를 요양병원에 가지 않고서도 충족시킬 수 있도록 정책의 전환이 절실한 시점이다."}, {"x": 12.177, "y": -2.966, "c": 11, "e": "e4", "t": "한편, 돌봄의 부재는 많은 감각을 기억에서 지운다. 감각이 무뎌진다는 것은 곧 내가 느끼는 감각을 다른 사람들이 함께 느끼거나 이야기하면서 서로의 감각을 객관화할 기회를 잃는 것을 의미한다. 후각은 돌봄의 부재로 인해 가장 먼저 무뎌지는 감각이다. 흔히 말하는 홀아비 냄새, 곰팡내, 땀에 쩐내 같은 냄새는 예삿일이고 차마 형언하기 힘든 차원의 냄새까지, 돌봄이 부족한 사람들을 만나다 보면…"}, {"x": 12.619, "y": -1.84, "c": 11, "e": "e4", "t": "이런 일들에 익숙해지다 보면 돌봄을 제공하는 봉사에도 양지와 음지가 구분된다는 것이 느껴지기도 한다. 그리고 이런 구별짓기는 의도하든 의도하지 않았든 불평등을 들춰내는 또 하나의 증거가 된다. 정치인들이 선거철만 되면 등장하는 연탄배달, 대학생들이 흔히 하는 교육봉사, 교회에서 하는 어르신 무료 급식소 같은 봉사활동은 희망과 미래를 바라보는 양지의 봉사에 가깝다. 양지의 봉사는 대체로…"}, {"x": 12.69, "y": -1.892, "c": 11, "e": "e4", "t": "하지만 음지의 봉사는 그렇지 않다. 저장강박가구 및 중증 치매 환자 가구 청소 지원, 알코올중독 가구 방문 및 상담, 공폐가 철거 지원 같은 봉사는 차마 사진으로 남기기 힘들 정도로 현장이 참담한 경우가 많다. 정체를 알 수 없는 동물과 해충들의 사체, 지금까지 겪어보지 못했던 심각한 수준의 악취, 심하게 녹이 슬어서 폐기하려고 손을 대면 으스러지는 폐자재들까지. 이 글을 읽는 이들을…"}, {"x": 12.647, "y": -2.038, "c": 11, "e": "e4", "t": "그래서 이른바 ‘양지의 봉사’를 보도하거나 SNS로 공유하고 홍보하는 행위들을 보면서 자조적인 생각이 들 때가 많다. 시혜와 선의에 기댄 양지의 봉사는 그 자체로 불평등의 수직적인 구조를 적나라하게 보여주는 수단에 그치는 것 아닐까 하는 자조 말이다. 음지의 봉사는 ‘당장 해결하지 못하면 나의 경계를 곧 침범할 것 같은’, 동시에 ‘그 누구도 이곳에서 웃으면서 봉사하지 못할 것’이라는…"}, {"x": 11.91, "y": -1.848, "c": 11, "e": "e4", "t": "왜 이 사람이, 이 건물이 아무에게도 존재의 필요성을 인정받지 못하는 상태에 이르렀는지, 그 책임을 국가와 구조에 돌리지 못하는가. 왜 사라진 돌봄과 무너진 사회경제적 지위의 귀책 사유를 개인에게만 돌리려고 하는가. 그런 식의 접근법이 정말 실질적으로 문제를 해결하는 데에 도움이 되기는 하는가? 이렇게 불평등을 의도적으로 외면해서 나아지는 현실은 아무것도 없다는 것을 잊어서는 안 된다."}, {"x": 11.758, "y": -2.032, "c": 11, "e": "e4", "t": "그리고, 한국 사회는 개인을 둘러싼 서사가 낳은 비극을 과하게 ‘개인의 문제’로 치부하는 경향이 있다. 비극을 개인의 차원에서 해석하려 드는 순간 그 사람이 지나온 삶의 서사는 깡그리 무시해 버림과 동시에 그를 둘러싼 사회경제적 맥락은 어디 내다 버렸는지 개인에 대한 비난만 이어간다. 그런 식의 얕은 비난은 그 사람의 삶을 개선하는 데에, 냉소에 절여진 우리들의 비관적 사고방식을 고치는…"}, {"x": 11.429, "y": -3.293, "c": 7, "e": "e4", "t": "또한, 약자에 대한 시혜적 시선은 문제를 해결하는 데에 큰 도움이 되지 않는다. 잘사는 사람이 못사는 사람을 연민하고 동정하는 것이 돌봄의 동인이 되는 순간 돌봄 관계는 수직적으로 정의된다. 돌봄이 필요한 사람의 서사와 맥락을 당사자가 아닌 이들이 파악하고 도움을 주려 하는 것은 굉장히 어려운 일이다. 왜 독거노인이 되었는지, 집안의 누가 사기를 당해 이혼을 당하고 가족관계가 단절되었는지,…"}, {"x": 12.054, "y": -2.558, "c": 11, "e": "e4", "t": "돌봄의 부재는 불평등 아래에서 커져만 간다. 관계의 단절과 돌봄의 부재를 시대의 흐름이라고 냉소하고 넘어가기엔 당장 우리 이웃의 삶에서도 어렵지 않게 확인할 수 있다는 점에서 위험하다. 기술 발전과 정부의 선심성 정책에 기대어 돌봄의 부재를 해결하고자 하는 노력은 문제를 해결할 수 있는 궁극적인 대책이 될 수 없다. 왜 사회경제적 불평등이 발생하는지, 그 이면에 담겨 있는 구조적 문제를…"}, {"x": 12.038, "y": -2.801, "c": 11, "e": "e4", "t": "불평등은 언제나 우리 곁에 숨 쉬고 있으며, 돌봄의 부재와 감각의 상실은 불평등을 적나라하게 보여주는 고름일 뿐이다. 그래서 더더욱 국가와 공동체는 돌봄을 제공하는데 있어 ‘시혜와 선의’의 자세에서 벗어나 같은 한 인간으로서, 헌법과 법률이 수호하는 존엄함을 지켜달라는 목소리에 귀 기울여야 한다."}, {"x": 13.214, "y": -2.747, "c": 12, "e": "e4", "t": "우리가 철저한 객체로서 목격하는 노동은 대체로 ‘우리 곁에 있지 않다’. 그래서 시간과 공간이라는 축만으로도 우리들의 노동은 구별될 수 있으며, 그 구분은 나와 다른 사람들 사이의 넘어서는 안 되는 선으로 작동하기도 한다. 그렇게 일터에서 마주하는 사람들의 연봉과 노동계급은 ‘물어봐서는 안 될 것’으로 여겨진다. 이소진은 ‘계급 없는 사회에서 계급을 드러내기 -다시, 사적인 것을 정치화해야…"}, {"x": 13.343, "y": -2.787, "c": 12, "e": "e4", "t": "서로의 계급에 대해 묻지 않음으로써 다른 사람의 노동은 철저히 객체화되며 타자화된다. 다른 사람이 어떤 일을 하면서 살아가는지 ‘묻는 행위’가 가지는 의미가 흐릿해져 간다. 다른 사람의 노동에 대해 묻지 않는 것이 하나의 ‘예의’이자 ‘도리’가 된 사회가 꼭 나쁘다는 점을 말하려는 것은 아니다. 되려 계급에 대해 묻지 않는다는 불문율이 존재한다는 사실만으로 사회를 재단하고 문제시하는 것…"}, {"x": 13.184, "y": -2.933, "c": 12, "e": "e4", "t": "불문율이 가져온 노동 현장에서의 침묵은 다른 사람의 노동을 ‘우리 곁에 있지 않은 것’으로 만든다. 하지만 그렇게 아무리 애써 다른 사람의 노동을 궁금해하지 않더라도 다른 사람의 노동과 그 노동이 만들어낸 결과물은 우리 곁에 있다. 우리 곁에 있는 노동을 우리가 의식하는지, 의식하지 않는지는 그다지 중요하지 않다. 우리의 의지와는 아무런 상관이 없다는 것이다. 뉴스에 지겹도록 나온…"}, {"x": 13.773, "y": -3.6, "c": 12, "e": "e4", "t": "우리 산업안전보건법 제52조는 산업재해가 발생할 위험이 있을 시 노동자가 안전을 확보하기 위해 일을 멈추고 대피할 수 있도록 ‘작업중지권’을 규정하고 있다. 하지만 작업중지권을 노동자의 자의로 발동하면 손해배상 소송을 당할 위험이 있다. 시사인의 보도에 따르면, 전형배 강원대 법학전문대학원 교수는 “노동조합이 강한 현대차에서도 안전 우려로 라인을 세우면 손해배상 소송을 당한다. 노조가 없는…"}, {"x": 13.875, "y": -3.668, "c": 12, "e": "e4", "t": "둘째, 작업중지권의 활용 실태를 보면 사고 예방보다는 인사사고 등 중대재해 발생 이후에 행사되는 특징을 보인다. (중략) 특히 노동조합의 보호를 받지 못하는 대다수 비정규, 영세중소기업 근로자의 경우 위험상황을 인지했다고 해도 작업중지권을 행사하는 것은 사실상 불가능한 것이 산업현장의 현실이다.”"}, {"x": 13.735, "y": -3.527, "c": 12, "e": "e4", "t": "이처럼 위험을 회피할 권리가 사문화된 현실 아래에서, 또 다른 대안은 아예 노동 현장에 위험이 발생하지 않도록 국가가 강력하게 감독하고, 안전보건조치를 규정대로 하지 않았으면 경영자를 처벌하는 것이다. 중대재해기업처벌법(이하 중처법)은 그런 면에서 여러 가지 이야깃거리를 만들어냈다."}, {"x": 13.451, "y": -3.259, "c": 12, "e": "e4", "t": "2022년 5월, 경기도 고양시 요양병원 증축 공사 현장에서 하청 노동자가 작업 중 5층 높이에서 추락했다. 이는 중처법 적용 첫 사례로 큰 주목을 받았으며, 검찰은 원청 대표를 기소했다. 2023년 4월, 의정부지법 고양지원에서 있었던 중처법 위반 1호 선고에서 원청 대표에게 징역 1년 6개월에 집행유예 3년이 선고되었다. 놀라운 지점은 1심 판결 이후 검찰과 피고인이 모두 항소를 포기해…"}, {"x": 13.511, "y": -3.23, "c": 12, "e": "e4", "t": "이원석 검찰총장은 2022년 9월 검찰총장 인사청문회 당시 ‘기계적 항소가 피고인을 고통스럽게 한다는 데 공감하며, 지양하겠다’는 입장을 밝힌 바 있다. 또한 ‘법원의 선고가 양형을 충족해도 사회적으로 더 높은 형을 받아야 할 범죄는 항소하되, 선고가 양형기준에 못 미쳐도 구체적 내용을 살펴 항소할 이유가 없는 건 하지 말라’는 구체적인 지침이 있었다는 중앙일보의 보도 또한 있다. 그렇다면…"}, {"x": 13.684, "y": -3.445, "c": 12, "e": "e4", "t": "한편, 중처법이 산재를 예방하는 데에 효과적이지 않는다는 설익은 비판은 2023년 초반을 전후로 소위 ‘주류 언론’에서 쏟아졌다. 조선일보는 2023년 1월 27일 자 사설에서 “기업이 현장 안전 관리를 강화하기보다는 방어적 행동에만 치우치고 있다”고 하며, “현장에 그물 치고, 신호수 배치하고, 위험 주의판을 단다고 중대 재해가 사라지는 것이 아니다. 기업들이 형사처벌을 의식해 안전 관리…"}, {"x": 13.656, "y": -3.419, "c": 12, "e": "e4", "t": "중처법 시행 이후 꽤 많은 것들이 바뀌었다. 기업들이 앞장서서 산업안전 컨설팅을 받아 사업장의 위험요소를 점검하기 시작했다. 기업들은 중처법 시행령 규정에 따라서 안전관리자를 선임하려는 노력을 하고 있는데, 미디어가 앞장서서 ‘중대재해를 예방하는 데에 아무런 소용이 없는 중처법’이라고 깎아내리는 것이 타당한가? 오히려 산재 사건이 일어나면 기사 몇 줄 써주던 소위 ‘주류언론’들이 중처법…"}, {"x": 13.545, "y": -3.193, "c": 12, "e": "e4", "t": "하지만 여전히 끼임, 추락으로 인한 산재는 하루가 멀다 하고 일어나고 있다. 2023년 3분기(누적) 기준 재해조사 대상 사고사망자는 여전히 459명에 이른다. (이건 놀랍게도 전년 동기 대비 51명이 감소한 수치다.) 여전히 하루에 1명 이상은 일터에서 목숨을 잃는 곳이 바로 대한민국이다. 그런데도 중처법이 우리 현실에 맞지 않고, 재계의 활동을 위축시키는 악법이라고 말할 수 있을까.…"}, {"x": 10.091, "y": -0.562, "c": 8, "e": "e4", "t": "가령 그런 거다. 한 사안에 대해 대립하는 두 가지 입장인 A와 B가 있다고 하자. B를 지지하는 근거를 바탕으로 B가 필요하다고 하면, A의 옹호자들은 ‘그럼 A는 필요 없다는 것인가?’ 따위의 반론을 펼치는 것이 흔히 보인다. 납작하게 보면 이런 논의는 ‘이분법적 사고에 대한 비판’으로 요약할 수 있다. 하지만 그 납작한 평면을 조물조물 만져보면 대부분의 사안은 ‘이분법에 대한…"}, {"x": 12.567, "y": -0.658, "c": 6, "e": "e4", "t": null}, {"x": 11.181, "y": -1.526, "c": 11, "e": "e4", "t": "성숙하다는 것은 내 주변의 누군가 느끼는 심연의 슬픔을 공감하는 것이다. 그런데 경제 기사는 이것을 수치로 표현할 수 없다. 경제 기사에 등장하는 1억 원은 금방 형해화 되어 그저 숫자의 의미만 남는다. 생명값이나 시계값이나 그냥 1억 원이다. 그러니 영끌로 1억 원 대출을 받아 시흥에 남양주에 평택에 아파트를 산 젊은 부부가 집값이 1억 원 내렸을 때의 슬픔을 이해하기도 어렵다. 그들에게…"}, {"x": 11.348, "y": -1.778, "c": 11, "e": "e4", "t": "CPI니 명목GDP니 아무리 떠들어도 그게 시민들의 삶을 그려줄 수 있는 설명력 있는 지표가 맞을까. 언론인들이 공허하게 떠드는 경제 지표는 정말 시민의 삶을 잘 보여줄 수 있을까. 국가와 권력자는 x.xx% 경제가 성장했다고 떠드는 것을 시민들이 얼마나 공허하게 받아들이는지 제대로 이해나 해줄 수 있을까. 회의적인 의문들이 머릿속을 스치면서 도저히 나는 이 글을 제대로 쓸만한 ‘깜’이…"}, {"x": 10.332, "y": 1.301, "c": 5, "e": "e5", "t": "온라인에 흘러다니는 글들을 읽다 보면 망령이 떠다니는 것을 우두커니 서서 바라보고 있는 듯한 느낌이 들 때가 있다. 하지만, 둥실둥실 떠다니는 망령들과는 달리 온라인의 언어에는 어떤 규칙이 있는 것 같다. 온라인 커뮤니티들이 각자의 뚜렷한 성향과 목적의식을 가지기 시작했으며, 이 과정에서 상대 진영, 혹은 ‘적’으로 규정되는 이들을 타게팅하고 포화를 쏟아내곤 한다. 그런데, 포화를 쏟아내는…"}, {"x": 10.494, "y": 1.692, "c": 5, "e": "e5", "t": "레토릭은 누구 하나에게만 주어진 칼이 아니다. 상대를 겨눴던 레토릭의 칼끝이 정신을 차리고 보면 자신을 겨누고 있을 때도 있다. 그렇기에 온라인의 레토릭을 비판적으로 바라보는 나조차도 그 비판의 대상이 될 수 있다는 함정 또한 존재한다. 후술하겠지만, 나는 내가 감히 ‘레토릭’을 비판할 자격을 가진 사람이라고 말할 수 없다고 생각한다. 그럼에도 불구하고, 한 가지 분명한 점은 모두를 겨누고…"}, {"x": 10.329, "y": 2.181, "c": 5, "e": "e5", "t": "선택적이라는 레토릭의 용례는 언뜻 떠오르지 않을 수도 있지만, 곰곰이 생각해보면 우리 인식 저변에 깔려 있는 논리적 방어기제임을 알 수 있다. 선택적 레토릭이라는 비판을 효과적으로 방어해내려면, 특정 주장을 펼침에 있어 그 주장과 관련된 모든 근거와 사례를 샅샅이 긁어와 발언하여 ‘선택적 주장’의 비판 가능성을 원천 차단하는 수밖에 없다. 굳이 어려운 사례를 들고 오지 말고, A와 B가…"}, {"x": 10.278, "y": 2.107, "c": 5, "e": "e5", "t": "그러나, 이런 식으로 논의를 이어가다간 모든 사람들의 주장과 논거가 ‘선택적’이라는 비판 하에 부정될 수 있다. 그렇기에 오히려 ‘선택적’이라는 비판을 수용하는 편이 나을지도 모른다 수 있다. 하지만, ‘선택적’인 레토릭을 인정하고 수용하기 위해서 전제해야 할 조건들이 몇 가지 있다. 이 조건들을 하나씩 짚어가면서 ‘선택적’이라는 레토릭을 사용함으로써 남을 비판하는 것이 얼마나 위험하고…"}, {"x": 10.43, "y": 2.272, "c": 5, "e": "e5", "t": "선택적이라는 레토릭이 가지는 가장 큰 전제조건이자 문제점은 바로 양날의 검이 될 수 있다는 점에 있다. 앞서 ‘선택적’이라는 지적을 피하기 위한 가장 완벽한 방법은 ‘선택적’이라는 비판을 듣지 않도록 모든 논거를 선택하여야 한다고 언급한 바 있다. 자신에게 유리한 주장을 펼치는 것처럼 보이기 위해 자신에게 유리한 논거만 ‘선택’한다는 것이다. 이는 상대방에게 ‘당신은 선택적으로 논거를…"}, {"x": 10.362, "y": 2.182, "c": 5, "e": "e5", "t": "둘째, 선택적이라는 레토릭을 지적하는 것이 아무런 의미가 없는 경우도 있다는 점이다. 논쟁의 성립을 위해 발화자는 필연적으로 자신의 주장을 더 잘 뒷받침하는 논거를 채택해야만 한다. 이 과정에서 굳이 자신의 주장과 큰 상관이 없거나, 자신이 말하고자 하는 바와는 다소 거리가 있는 논거를 들 필요는 없다. 따라서 주장의 강화를 위한 논거 선택은 필연적으로 ‘선택적’일 수밖에 없다. 또한,…"}, {"x": 10.703, "y": 2.276, "c": 5, "e": "e5", "t": "니체는 우리의 인식론이 애초에 불완전한 것임을 지적하며 동시에 인식할 수 있다는 사실이 ‘부조화’라고 느꼈다. 하지만 우리의 불완전한 인식론을 ‘부조화’가 아닌 ‘조화’로운 것으로 재정의하는 것은 어떨까. 논리와 사고가 우리의 인식에 기반하여 성립한다면, 인식 자체가 불완전한 상황에서 우리의 논리와 사고 또한 불완전할 수밖에 없음을 상정하는 것이 오히려 조화로운 사고를 가능케 할 수 있다.…"}, {"x": 10.541, "y": 1.379, "c": 5, "e": "e5", "t": "선민의식이라는 레토릭을 다른 말로 표현하면 ‘가르치려 들지 마라’ 정도로 요약할 수 있겠다. ‘네너가 뭔데 날 가르치려 드느냐’ 혹은 ‘정치적 올바름을 잣대로 선민의식에 빠져 있는 누구누구가 역겹다~’ 정도의 레토릭이 자주 관찰된다. 얼마 전 싸이 워터밤 행사를 비판한 배우 이엘의 트윗에 대한 논란이 이를 잘 보여주고 있다. 이엘의 말이 타당하다는 사람들과, 이엘이 PC주의자이며 자신이…"}, {"x": 10.82, "y": 1.096, "c": 5, "e": "e5", "t": "그럼에도 불구하고 짚고 넘어가야 할 지점은 존재한다. 첫째, 선민의식이라는 레토릭에서 발화자가 생략할 수밖에 없는, ‘발화의 맥락’이다. 가령, 여러분의 지도교수와 여러분이 어떤 이슈를 가지고 토론을 할 때, 서로는 어렴풋이 왜 ‘상대방이 저 생각을 하게 되었을까’를 짐작할 수 있을 것이다. 평소 상대방의 생각 혹은 성향을 짐작할 수 있고, 그에 기반해 상대방이 자신의 주장을 펼칠 때…"}, {"x": 10.733, "y": 1.248, "c": 5, "e": "e5", "t": "온라인 공간에서는은 ‘익명인 상대방에 대한 이해’가 사실상 불가능하다. 온라인에서 담론이 재생산되는 과정을 크게 두 갈래로 나누어 보자. 한 가지는 ‘같은 견해/성향을 가진 이들’끼리 모인 커뮤니티에서 자신들의 의견과 일치하는 주장만 끊임없이 수용함으로써 이뤄진다. 특정 커뮤니티의 주류 담론에 반기를 드는 의견이 제시되면, 집단 린치마냥 ‘반기를 든 의견’을 억압하고 몰아냄으로써 결속을…"}, {"x": 10.695, "y": 1.437, "c": 5, "e": "e5", "t": "둘째, 선민의식이라는 레토릭이 가지고 있는 가장 큰 특징이자 취약점은 미러링 전략에 있다. ‘내게 무언갈 강요하지 마라’, 혹은 ‘정의로움에 취하지 말라’고 이야기하며 발화자를 비판하지만, 발화자가 정말로 그런 생각을 가지고 있는지 검증되지 않는 경우가 존재할 수 있다는 점이다. PC주의자들을 비판하는 이들이 주로 공격하는 소재가 ‘맥락을 보지 않고 일침을 가하여 자신이 도덕적으로…"}, {"x": 11.549, "y": 1.359, "c": 5, "e": "e5", "t": "각설하고, 내게 흥미로웠던 점은 피터 싱어가 저서 ‘동물해방’에서 ‘지나치게 감정적인 서술을 해서 독자로 하여금 냉정함을 잃게 만든다’고 생각한 사람이 있었다는 것이다. 처음에는 나도 속으로 ‘그래. 싱어가 글을 좀 과격하게 쓰긴 했지’ 싶었는데, 되짚어보면 ‘동물해방’에서 감정을 직접적으로 서술하는 구절은 거의 없다고 해도 무방했다. 그럼에도 불구하고 ‘동물해방’을 읽다가 소름이 끼치지…"}, {"x": 11.642, "y": 1.383, "c": 5, "e": "e5", "t": "이 구절을 읽은 후 사람들은 굉장히 다양한 반응을 보일 것이다. 누군가는 많고 많은 글들 중에 굳이 이 글을 인용한 나에게 굉장한 원망을 보내면서 분노할 것이다. 그렇게 충격받았음에도 불구하고 치킨을 먹을 때는 그 감정을 싹 지우고 즐기는 사람도 있을 것이다. 누군가는 ‘동물해방’을 읽고 엄청난 충격을 받아서 완전한 비건[1]이나 락토[2]를 선언한 사람도 있을 것이다. 그 행동의 양상이…"}, {"x": 11.557, "y": 1.52, "c": 5, "e": "e5", "t": "한 가지 분명해 보이는 사실은, 사람마다 다른 ‘마음’이라는 프리즘은 같은 실제, 즉 같은 상(像)을 보고도 완전히 다른 감정을 도출해낼 수 있다는 것이다. 가령, 비거니즘을 실천하는 사람들에 대한 시선은 참 다양하다. ‘같이 밥약도 못해서 남들에게 피해주는 사람’이니 하며 부정적인 감정을 느끼는 사람들도 있고, ‘동물해방에 대한 공감에 기초한 윤리적 행동을 하는 사람’이라며 긍정적으로…"}, {"x": 11.393, "y": 1.939, "c": 5, "e": "e5", "t": "그 어느 구절에서도 감정적인 표현을 사용하지 않았음에도, 글쓴이는 그저 현실을 가감없이 이성적으로 표현했음에도, 그럼에도 불구하고 그 글에서 ‘감정의 요동침’을 느낀 사람이 많다는 사실은 나로 하여금 참 많은 생각을 하게 만들었다. 감성적 사고와 이성적 사고는 양립 가능하며, 감성과 이성의 경계선은 사람마다 다르다는 것을 확인하게 되었기 때문이다.이었다."}, {"x": 11.197, "y": 2.068, "c": 5, "e": "e5", "t": "감정적 사고가 이성적 사고의 영역을 어느 정도 침범해서 잠식할 수는 있다. 하지만 감정적 사고와 이성적 사고는 양립 가능하다는 사실 또한 직시할 필요가 있다. 사람마다 다른 감정과 이성의 경계에서, 누구 한 명의 ‘이성적 스탠다드’를 요구하는 것 자체로 강요가 될 수 있다는 사실을 항상 잊어서는 안되는 이유이다. 또한, 비판의 목적으로 ‘감성적’이라는 레토릭을 사용하는 것은 감성적임을…"}, {"x": 11.2, "y": 1.855, "c": 5, "e": "e5", "t": "감정을 관찰하는 내면의 중립적 제3자가란 애초에 존재할 수 없다는 것은 이 주제에 대해 깊이 생각해보지 않고서야 쉽게 떠올리기 어려운 아이디어이다. 따라서 남이 ‘감성적’임을 비판하는 사실 자체가 ‘감정’의 수준에서 이뤄지게 되고, 이 때문에 ‘감성적’이라는 레토릭에 동원되는 비판이 ‘감정적 비아냥’에 그치는 것이 자주 목격된다.고 해도 과언이 아니라고 생각한다. 또한, ‘감성적 레토릭’의…"}, {"x": 11.218, "y": 1.66, "c": 5, "e": "e5", "t": "같이 눈높이를 맞춰보겠다는 알량한 말 따위로는 도저히 이해할 수 없는, 거대한 우물 밖이 존재한다. 역지사지하겠다고, 약자의 입장에서 바라보겠다고 말한다고 달라지는 현실은 없다. 그 사람이 되어보기 전까지는 절대 알 수 없는 사실이 존재한다는 것을 항상 상정해야 하는 이유이다. 그러니까, ‘감정적인 근거’를 이용해 주장을 펼치는 이에게 ‘감정적’으로 말하지 말마라고 ‘일침’을 가할 것이…"}, {"x": 11.229, "y": 2.12, "c": 5, "e": "e5", "t": "논리적, 이성적 완벽함을 주창하고 감성을 배격하는 논리를 쉽게 납득하기 어려운 이유는 여러 가지가 있다. 그 이유들 중에서 가장 설득력 있게 들리는 것은 ‘이성적/논리적 완벽함’을 추구하는 것이 인간에게는 너무나도 어려운 것이라는 점이에 있다. 동시에 이성과 감성은 안티테제가 아닐 수 있으며, 오히려 이성과 감성이 양립함으로써 더 조화로운 논리가 탄생할 수 있다는 점을 잊어서는 안된다고…"}, {"x": 12.003, "y": 2.707, "c": -1, "e": "e5", "t": "자격 담론은 현실에서 어떻게 구현되는가. 남의 무언가를 비판하려면, 발화자가 그 비판의 대상이 하지 못하고 있던 행동 혹은 발언을 하고 있어야 한다는 이른바 '자격 요건' 말이다. 내가 기부를 하지 않는데 남에게 기부하라고 말하는 것이 이상하게 들리는 것이 그 예시가 될 수 있겠다. 언뜻 보면 타당한 주장이다. 아마도 이러한 논리는 내가 하기 싫어하는 행동을 남에게 강요하면 안 된다는…"}, {"x": 11.979, "y": 2.718, "c": -1, "e": "e5", "t": "대체로 우리는 '그 자격'을 갖추지 않은 채 남을 비판하는 이를 비판하곤 한다. 많은 사람들을 살해한 연쇄살인범이 \"가난한 이들을 위해 기부하자\"라고 말하면 많은 이들은 코웃음치곤 할 것이다. 허나 그의 주장 그 자체는 꽤나 윤리적이며 참이기도 하며 유효하기도 한 주장이다. 논리적으로는 타당하다는 것이다. 그 논리가 누구로부터 발화되느냐가 우리의 관심사일 것이다. 이처럼 명제의 참 거짓을…"}, {"x": 12.052, "y": 2.629, "c": -1, "e": "e5", "t": "시간이 갈수록 이 '자격 요건'에 대한 담론이 고도화되고 까다로워진다는 느낌이 든다. 많은 사람들이 함부로 \"기부하자\"라고 말하지 않는 이유는, 자신도 이미 기부하고 있지 않은데 남들에게 \"기부하자\"라고 말해서 굳이 불필요한 충돌을 만들지 않고 싶어 하는 마음에서 기인한 것 아닐까 싶다. '자격 요건'이 갈수록 복잡해지고 까다로워지는 것은 '사회의 파편화 정도'와 어느 정도 상관이 있을…"}, {"x": 12.019, "y": 2.703, "c": -1, "e": "e5", "t": "이야기의 흐름을 바꿔서, '누군가를 비판하기 위한 자격 요건'에 대해서 말해보고자 한다. \"기부하자\", \"쓰레기를 적게 버리자\"와 같은 거슬리는 소리를 내게 해주는 사람은 그 '자격 요건'들을 모두 충족해야만 할 것이다. 그래야 그 주장에 설득력이 있다고 생각할 것이니까 말이다. 그런데, '선한 잔소리를 하기 위한 자격 요건'과 '남들을 까내리는 비판을 하기 위한 자격 요건'을 완전히…"}, {"x": 11.812, "y": 2.544, "c": -1, "e": "e5", "t": "과연 우리는 그들을 비웃을 자격이 있는가. '잔소리를 하기 위한 자격 요건'과 '남을 까내리는 비판을 위한 자격 요건'을 자기 편한 대로 해석하고 받아들이는 사람이 되고 있지는 않은가. 남들을 '선택적'이라고 비판하면서 정작 자신의 기준이 그 무엇보다도 '선택적'이라는 생각은 해보지 않았던 것인가. 객관화된 타자로 당신의 미래를 바라보라. 과연,. 가슴에 손을 얹고 그렇게 말할 수 있는가."}, {"x": 10.244, "y": 1.457, "c": 5, "e": "e5", "t": "모든 이들의 언어가 부드럽고 순할 수만은 없다. 같은 말을 하더라도 어조, 억양, 목소리 높낮이 등에 따라서 어감이 달라질 수 있기 때문이다. ‘레토릭’만으로 모든 사람들의 언어를 퉁치고 일반화하는 것은 위험한 시도일 수 있음을 부정하고 싶지는 않다. 그러나, 온라인을 떠도는 말(이라고 부르고 칼이라 쓰고 싶은 것)들에는 분명 정형화된 패턴이 있다. 또한, 단순히 어휘의 출현 빈도와 어조를…"}, {"x": 10.559, "y": 4.293, "c": 0, "e": "e6", "t": "KTX가 종착역에 도착하면 객실 복도를 따라 긴 하차 줄이 생긴다. 나는 그 줄에 서는 것이 귀찮아서 제일 끝까지 앉아 있다가 줄이 사라지면 짐을 챙겨 내리곤 한다. 얼마 전에 서울역에 도착해서 여느 때처럼 내리는 줄이 줄어들기를 기다리고 있는데, 2분, 3분이 지나도 줄이 없어지지 않았다. 의아해서 반대쪽 줄을 따라 내려서 대합실을 향해 걸었다.걷는데, 알고 보니 내가 내리려고 했던…"}, {"x": 10.661, "y": 4.242, "c": 0, "e": "e6", "t": "고상홈 구축은 교통약자의 이동권 보장을 위해 가장 절박하게 요구되는 사안 중 하나이다. 쉽게는 지하철을 생각하면 된다. 열차에서 타고내릴 때 계단을 이용하지 않고 열차-플랫폼이 계단이나 경사 없이 붙은 플랫폼을 고상홈이라고 한다. 당연히 거동이 불편한 노약자 및 장애인, 휠체어 승객 등이 쉽게 철도를 이용할 수 있게 하는 기본적인 플랫폼이다. 하지만 광역교통을 책임지고 있는…"}, {"x": 10.742, "y": 4.088, "c": 0, "e": "e6", "t": "고상홈 구축을 해도 교통약자들의 이동권이 완전히 보장된다는 것은 아니다. 지하철의 사례에서 보듯이 도저히 휠체어 탄 사람들이 쉽게 지하철을 이용할 수 있는 동선이 완전히 마련되지 않았고, 설령 마련된 역이라고 할지언정 일반인이 이용하는 지하철역의 동선 편의성과는 비교하기 민망할 정도로 여전히 이들의 이동권은 비장애인에 비하여 참담한 수준이다. 사실 이 문제를 파악하는 것은 그다지 어렵지…"}, {"x": 10.875, "y": 4.089, "c": 0, "e": "e6", "t": "사고 당시 CCTV를 살펴보면, 고인이 엘리베이터 앞에 사람들이 줄 서있는 것을 확인하고도 1-2분간 기다리다가 에스컬레이터로 이동했다는 사실이 확인되었다고 한다. 하지만, 엘리베이터는 휠체어 이용자뿐만 아니라 노약자 혹은 일반인마저 이용하는 ‘편한 이동수단’이기 때문에 전동휠체어 혹은 전동스쿠터 이용자가 여기에 비집고 들어가는 것은 결코 쉬운 일이 아니다. 노들장애인자립생활센터 활동가…"}, {"x": 10.936, "y": 4.145, "c": 0, "e": "e6", "t": "가장 결정적인 문제는 해당 엘리베이터가에 전동스쿠터 혹은 전동휠체어가 탈 수 없도록 설계되었다는 점이다. [더인디고]의 보도에 따르면, 양천향교역의 엘리베이터 입구 폭은 90cm에 불과하다.[2] 2008년, 국토교통부가 고시한 ‘도시철도 정거장 및 환승‧편의시설 설계 지침’에 따른 엘리베이터 설치 규정이 “엘리베이터 전면에는 휠체어 사용자의 승강을 위해서 1.5m×1.5m 이상의…"}, {"x": 11.07, "y": 4.35, "c": 0, "e": "e6", "t": "규정상 엘리베이터 설치 지침 개정 전에 설계가 이루어졌기 때문에, 양천향교역 운영사의 과실 혐의점을 찾지 못하여 수사를 끝냈다고 한다. ‘법적으로 틀린 것은 없으니까’ 아무도 책임지지 않는 것이다. 그리고, 서울시는 사고가 일어난 이후 서울시는 9호선 구간에도 차단봉을 설치하겠다고 밝혔다. 그렇게 사람이 죽어야 조치가 이뤄진다. 책임지는 이는 없다. 법적 문제는 없으니까 말이다."}, {"x": 10.842, "y": 3.843, "c": 0, "e": "e6", "t": "책임지는 이는 없지만, 고인에게 악플을 다는 이들은 널리고 널렸다. 고인과 전장연에게 인신공격을 가하는 이들은 포털의 댓글창에, 커뮤니티에, 그리고 SNS에 널려 있다. 온라인의 많은 이들이 ‘중립기어’를 외치지만, 정작 자신이 당사자성을 가지고 있지 않은 집단의 사건에 대해서는 ‘중립기어’는 내다 버리고 ‘인신공격성 집단린치’를 가하고 있는 모습이다. 이것이 ‘이동권 투쟁’을, 아니…"}, {"x": 11.549, "y": -1.75, "c": 11, "e": "e6", "t": "결국 돈이 문제다. 돈. 정부와 기업의 합리적 선택을 위한 최적점은 비용을 최소화하고 효용을 극대화하는 점에서 찍히겠지만, 이제는 그 효용곡선을 산출하는 방정식을 손봐야 할 시기이다. 99%의 일상을 존속시키기 위해 1%가 불편을 감수하는 사회에서, 1%는 항상 사회경제적 약자일 수밖에 없다. 그리고, 대한민국 헌법 그 어디에도 다수의 행복을 위해 소수가 불편을 감수해야 한다는 조문은…"}, {"x": 10.172, "y": 4.649, "c": 0, "e": "e6", "t": "이번 여름에 인턴을 하면서 평일에 2호선 신촌역-2호선 선릉역을 출퇴근하고 있다. 일주일정도 출퇴근을 하고 나니 대략 집에서 몇 분쯤에 나서서 몇 분에 오는 버스를 타고 신촌역에 가서 몇 분 기차를 타고 언제 왕십리에서 내려서 언제쯤 선릉역에 닿을지 계획이 착착 생긴다. 계속 출퇴근을 하면서 문득 어떻게 이 수많은 교통수단이 배차간격을 지키면서 다니는지 경외심이 생기곤 했다. 출퇴근…"}, {"x": 10.47, "y": 4.757, "c": 0, "e": "e6", "t": "2005년 일본에는 유난히 철도사고가 많이 일어났다. 그 중 가장 큰 충격을 안긴 사고는 JR서일본 후쿠치야마선 탈선사고다. 105명이 숨졌고, 수 백 명이 다쳤다. 원인은 간단했다. 커브 구간에서 전동차가 규정속도인 70km/h에 비해 46km/h가량 초과한 116km/h로 진입했으며, 이로 인해 열차 선두부가 공중으로 뜨며 탈선했고, 열차는 잭나이프 현상을 일으키며 인근 맨션에…"}, {"x": 10.243, "y": 4.892, "c": 0, "e": "e6", "t": "왜 정시 운행 실패의 책임을 오로지 기관사 혹은 운전기사가 져야 하는가? 지하철의 경우에는 RH에 승객들의 뛰어들기 탑승, 승하차 시간 소요 등으로 인해 지연이 발생할 수밖에 없으며, 도로를 이용하는 버스는 교통체증 등의 문제로 지연이 필연적이다. 하지만 문제는 기관사나 운전기사의 역량만으로 회복할 수 없는 배차 지연의 책임을 오롯이 이들기관사나 운전기사에게만 물으려 하는 데에 있다. 설령…"}, {"x": 10.33, "y": 4.928, "c": 0, "e": "e6", "t": "서울시는 배차간격을 잘 지킨 버스회사에 인센티브 형식으로 보조금을 지원한다. 그렇지 않은 회사는 당연히 보조금을 지원받을 수 없다. 그렇기에 버스회사는 기사들로 하여금 강요와 압박을 동원해 배차간격을 엄수하도록 요구한다. 언뜻 보면 서울시가 인센티브를 통해 버스회사들로 하여금 ‘정시성’을 지키도록 유인하는 좋은 정책처럼 보인다. 하지만 인센티브를 이용한 정책은 필연적으로 경쟁을 낳는다.…"}, {"x": 10.141, "y": 4.817, "c": 0, "e": "e6", "t": "사실 버스회사는 인센티브가 걸려 있기 때문에 버스기사에게 배차간격 준수를 압박할 수밖에 없다. 또한 대중교통의 정시성은 시민 편의 입장에서도 꽤나 중요한 것이 사실이다. 하지만 배차간격 준수를 위해 인센티브를 내걸고 경쟁을 유도하는 것은 배차간격 미준수 및 지연의 책임을 엄한 곳에 전가하는 것일뿐더러, 승객의 안전을 담보로 사실상 내기를 하는 것과 다르지 않다."}, {"x": 10.424, "y": 4.83, "c": 0, "e": "e6", "t": "대중교통의 정시성과 안전에 관한 문제도 돈이 발목을 잡고 있다. 그렇다고 배차 정시성 문제를 포기하자니 서울시의 입장이 난감해지는 것 또한 부정할 수는 없다. 하지만 정시성을 지키기 위해서 인센티브로 버스회사를 유인하는 정책은이 서울시의 교통상황을 고려할 때 결코 현실적이지도 않고, 더군다나 그것이 시민의 안전과 직결되어 있다는 점은 정책을 시행할 때 운영에 있어서 고쳐야 할칠 부분이 매우…"}, {"x": 11.182, "y": -0.86, "c": 6, "e": "e7", "t": "몇몇 이야기만 나오면 모든 한국인이 ‘나 전문가요’ 하며, 손 들고 나와서 숟가락 얹을 때가 있다. 그리고 그렇게 포장된 한국은 대체로 끔찍한 디스토피아다. 이 이야기를 골똘히 들어보면, 한국은 이기적인 인간들이 판을 치며, 가정교육과 교권이 무너졌고, 아이는 태어나지 않으며, 부동산 가격은 치솟으니, 곧 망할 것이라는 비관주의가 한국을 잠식하고 있다."}, {"x": 10.741, "y": -0.696, "c": 6, "e": "e7", "t": "이러한 비관주의를 틀렸다고 말하고 싶지 않다. 하지만 이는 세상을 해석하는 시각들 중의 일부일 뿐, 한국이라는 시스템을 하나의 방향성이나 단어로 환원하지는 못한다는 사실을 짚고 넘어가야 한다. 애초에 어떤 단어 하나만으로 우리 사회를 포장하는 것은 은유의 연장선일 뿐, 그것이 시대를 꿰뚫는 통찰이 될 수 없기 때문이다. 대한민국이라는 복잡한 시스템에 단순한 제목을 붙이려 하는 것은 오히려…"}, {"x": 10.748, "y": -0.861, "c": 6, "e": "e7", "t": "다들 가슴속에 세상에 대한 불만 하나쯤은 갖고 있으리라 생각한다. 그 불만들은 어쩌면 이 사회를 진단하고 더 나은 길로 나아갈 수 있게끔 하는 땔감이 될 수도 있다. 그렇다면 우리가 할 수 있는 일은 가슴속에 구겨진 불만 하나하나를 펼쳐 보면서, 문제의 본질과 입체성이 무엇인지 들여다보는 것이다. 예민함, 쿨함, 민주주의, 자본주의와 자유. 비록 이 글에서 다루는 소재들이 한국적 상상력을…"}, {"x": 13.509, "y": 0.685, "c": 3, "e": "e7", "t": "필자는 지방 일반계 남고를 졸업했다. 2010년대 후반, 내가 기억하는 남고는 교사가 학생들에게 성희롱성 발언을 하더라도 다같이 웃고 넘어가고, 학생이 잘못하면 교사가 쌍욕에 가벼운 체벌을 섞는 경우도 심심찮게 볼 수 있는 곳이었다. 하지만 해가 갈수록 교육현장에서의 에피소드는 더 이상 썰이 아니라 사건이 되고 뉴스가 되었다. 수학여행에서 학생이 다치면 교사와 학교가 고소 당하고,…"}, {"x": 13.47, "y": 0.623, "c": 3, "e": "e7", "t": "학교안전사고 예방 및 보상에 관한 법률은 2007년에 제정되었다. 이 법이 제정되기 전에는, 학교 사고가 체계적으로 집계될 이유도 없었고, 사고가 발생해도 학교와 학부모 간 합의로 처리되곤 했다는 것이다. 따라서 이와 관련한 데이터는 측정되지 않았고, 존재하지 않는 것처럼 보였다. 하지만 관련 법 제정 후, 학교안전공제회에 사건이 보고되면, 피해 학생이 명문화된 절차에 따라 보상받을 수…"}, {"x": 13.459, "y": 0.583, "c": 3, "e": "e7", "t": "학교안전에 대한 관심은 늘어나고 시설은 현대화되는데, 학생 만 명 당 사고 건수가 폭증하는 것이 상식적인 흐름이라고 볼 수 있을까? 차라리 과거에 측정되지 않던 사고들이 서서히 측정되기 시작했다고 보는 것이 옳지 않을까?"}, {"x": 13.35, "y": 0.417, "c": 3, "e": "e7", "t": "언론에 대서특필되는 몇 개의 사건들로 인해 사람들은 서서히 위축되고, 합의보단 소송을 선택하며, 이로 인해 교육현장에서의 적극성은 사라진다. 최근의 이런 흐름을 부정하고 싶지는 않다. 하지만 점점 많은 사건들이 윗선에 보고되고, 그것이 행정적 절차를 따르게 되는 것이 반드시 나쁘다고 볼 수 있을까? 더 많은 사안들이 보고되고 보상되면서, 공적 영역은 더 촘촘해지고 재발방지 대책이 더 확실히…"}, {"x": 13.359, "y": 0.838, "c": 3, "e": "e7", "t": "다만, 제도가 촘촘해지고, 윗선에 보고되는 사안이 많아질수록, 이를 처리하고 중재할 인력 또한 늘어나야 한다. 소송이 아니라 합의 위주의 공적 시스템이 작동하려면 제도적 장치가 마련되고 이를 담당할 조직 또한 확충되어야 한다. 하지만 우리가 어떤 민족인가. 없는 살림(사실 없는 살림인지도 모르겠지만)에 사람 갈아넣어서, 누구 하나 죽어야 ‘아 뭐가 잘못됐구나’ 하지만, 그 뒤로도 현실은…"}, {"x": 13.559, "y": 1.108, "c": 3, "e": "e7", "t": "달리 말하면, 시스템이 서비스를 제공할 수 있게끔 하는 완충지대가 충분히 마련되어야 하지만, 그렇지 않은 채로 제도만 촘촘해지고 있다는 것이다. 제도가 지향하는 방향성이 옳더라도, 시스템이 이를 받아낼 수 없다면, 당연히 파열음은 커지고 갈등만 증폭될 수밖에 없다. 교육부는 올해 1월, 교권보호대책의 일환으로 민원대응팀 신설을 제시했지만, 팀원 구성에 있어서 교사가 포함될 여지를 열어뒀다.…"}, {"x": 13.106, "y": 0.623, "c": 3, "e": "e7", "t": "문제는 이 고화질의 비명들을 처리할 시스템의 용량이 턱없이 부족하다는 데 있다. 기록은 촘촘해졌는데 그것을 받아낼 '여유(Buffer)'가 없는 과밀한 현장에서, 개인들이 느끼는 피로감을 단순히 '예민함'이라는 단어로 퉁치고 넘어갈 수는 없다. 따라서 우리가 던져야 할 질문은 \"왜 이렇게 예민해졌어?\"가 아니다. \"이 쏟아지는 기록들을 감당할 준비가 우리 시스템에는 되어 있는가?\" 라고…"}, {"x": 11.232, "y": -0.153, "c": 6, "e": "e7", "t": "유튜브든, 네이버든 하물며 인스타그램이든 한국의 댓글 창은 ‘만인에 대한 만인의 투쟁’ 상태다. 온갖 조롱과 욕설, 멸칭이 난무하는 와중에, 댓글 한 줄을 쓰는 것만으로도 사람을 피폐하게 만드는 재능을 가진 사람들이 정말 많다는 것을 느끼는 요즘이다. 하물며 정치와 상관없는 기사에도 ‘이재명 때문에’, ‘윤석열 때문에’ 따위의 댓글이 차고 넘치는 것을 보면, ‘온라인이 정치적 수사의 늪에…"}, {"x": 16.07, "y": 0.992, "c": 2, "e": "e7", "t": "계엄을 옹호하는 사람들은 \"비상한 조치가 필요했다\"고 말한다. 민주당의 줄탄핵과 예산 삭감으로 특단의 조치가 필요했다고 주장하며, 그것을 계엄을 통해 알게 됐다는 이른바 ‘계몽령’을 신나게 펼친다. 하지만 그들이 이야기하는 ‘거대야당 민주당의 입법 폭주’는 군경을 동원해 때려잡아야 하는 계엄 사유가 되지 않는다. 극한대립 하에서도 결국 여야는 합의로 법률안을 타결해야 하고, 이를 위해…"}, {"x": 15.957, "y": 1.083, "c": 2, "e": "e7", "t": "윤석열 탄핵의 맥락을 보자. 민주당은 2024년 총선에서 압승했다. 윤석열에 대한 국민들의 경고였다. 이는 민주당과 타협하기 위해서는 정부여당이 더 많은 것을 내려놔야 한다는 것을 의미했지만, 윤석열은 타협하지 않았다. 달리 말해, 정치하지 않았다. 정부여당은 거대 야당과 타협하기보다는 거대 야당의 정치를 부정하려 들었다. 윤석열은 약 2년 반의 집권 기간동안 25번의 법률안 거부권을…"}, {"x": 16.012, "y": 1.058, "c": 2, "e": "e7", "t": "하지만 대통령제 국가에서 재의요구권의 남발은 곧 대통령의 정치력 부재를 반증하기도 한다. 국회에서 무리한 법률이 통과될 것 같으면, 정부여당은 야당에게 더 많은 것을 내어 주고 타협해서 문제를 해결해야 한다. 이를 위해 대통령실 정무수석이 존재했던 것이기도 하다. 그러나 대통령은 여전히 독선적이었다. 대통령 취임 이래 2년간 이뤄진 정치 행위들과 독선마저 2024년 총선 참패로…"}, {"x": 16.051, "y": 1.187, "c": 2, "e": "e7", "t": "문제는 이 이후에 지속되는 자칭 ‘계몽된 사람들’이 일으키는 잡음에 있다. 이들은 우리 민주주의가 가진 절차적 정당성과 구조적 특성을 이해하려 하기보다는, 오로지 ‘민주당의 독주’, 그 자체에 집중한다. 입법 독주와 줄탄핵은 대통령에 대한 존중이 아니며, 더 나아가 이들이 선출된 선거가 부정하다는 이야기를 꺼낸다."}, {"x": 16.016, "y": 1.045, "c": 2, "e": "e7", "t": "이런 계몽령에 대한 가장 적확한 반박은 다름아닌 헌재 결정문에 있다. 헌재는 결정문에서 거대 야당의 예산 삭감이나 탄핵 소추가 국정 마비와 사회 혼란을 초래했다는 대통령의 주장에 대해, 그것이 헌법이 정한 국회의 권한 행사일 뿐, 국가 비상사태 선포의 근거가 될 수 없음을 분명히 했다. 오히려 \"국가긴급권은 평상시의 헌법질서로는 대처할 수 없는 위기 상황에 대한 예외적 비상수단\"이어야…"}, {"x": 15.734, "y": 0.887, "c": 2, "e": "e7", "t": "헌재는 국회 역시 \"정부와의 관계에서 관용과 자제를 전제로 대화와 타협을 위해 노력했어야 했다\"며 정치적 양극화에 대한 아쉬움을 표했다. 정형식 재판관이 보충의견을 통해 탄핵소추안이 부결될 경우 같은 탄핵 사유로 회기를 바꿔 탄핵안을 다시 발의하는 것이 정치적 혼란을 야기할 수 있다고 지적한 것 또한 같은 맥락일 것이다. 이처럼 헌재의 결정문은 우리에게 '민주주의 시스템은 폭력보다…"}, {"x": 15.727, "y": 1.248, "c": 2, "e": "e7", "t": "계엄이 우리 민주주의에 남긴 교훈이 있다면, 그것은 민주주의를 지키는 힘이 누군가의 '비상한 결단'이 아니라 우리가 헌법으로 합의한 '지루한 절차' 속에 있다는 사실을 깨닫게 된 것에 있다. 그 절차가 언제나 완전무결할 수 없다는 점에서, 헌법과 정치에 대한 국민의 견제와 심판은 끈질기게 계속되어야 할 것이다."}, {"x": 11.431, "y": -1.052, "c": 6, "e": "e7", "t": "얼마 전 일본여행에서 한국인들이 많이 방문하는 어떤 사찰을 방문했다. 사찰에는 나무로 된 소원판을 작성해서 걸어둘 수 있었다. 일본인들은 주로 대학 입시 합격, 가내안전 같은 소원들을 적어뒀다. 어떤 외국인 관광객은 소원으로 'WORLD PEACE'를 적어두고 갔다. 그런데 유독 한국인들의 소원에는 '돈 많이 벌게 해주세요', '주식 대박' 같은 문구가 빠지지 않고 등장했다. 여행지에서조차…"}, {"x": 11.889, "y": -1.088, "c": 6, "e": "e7", "t": "시장은 완벽하며 모든 시장 참여자들은 최적 선택을 위해 노력하는가? 주류경제학이 상정하는 이 '합리적 인간'과 '완전 시장'의 신화는 한국이라는 현실 세계에서 처참하게 빗나간다. 경제학 모델들은 그 자체로 설득력을 가지며, 자유주의 아래 현실을 충실히 반영하여 작동한다고 믿어져 왔다. 하지만 그 견고한 가정들은 산업사이클의 하락, 그리고 거시경제 상황이 나빠질 때마다 무너져 내렸다.…"}, {"x": 11.576, "y": -0.916, "c": 6, "e": "e7", "t": "한국적 상상력은 여기에 '부동산 불패'라는 종교를 더한다. 한국의 GDP 대비 건설투자 비중은 약 15% 수준으로 OECD 평균(약 10~11%)을 크게 상회하며, 이는 한국 경제가 얼마나 기형적으로 콘크리트 위에 쌓아 올려졌는지를 방증한다. 50대 기업집단의 면면을 뜯어보면 중흥, DL, HDC, 호반, 부영 등 건설업을 모태로 하거나 주력으로 하는 그룹들이 상당 비중을 차지한다.…"}, {"x": 11.773, "y": -0.748, "c": 6, "e": "e7", "t": "이 거대한 '부동산 부양'의 역사는 정권을 가리지 않고 반복되었다. MB 정부의 뉴타운 광풍부터 시작해 박근혜 정부의 '초이노믹스'는 \"빚 내서 집 사라\"는 시그널을 보내며, 가계 부채를 폭발적으로 증가시켰다. 이 시기 LTV 와 DTI 완화는 당장의 GDP 성장률을 방어하는 데는 성공했을지 몰라도, 가계의 미래 소득을 저당 잡아 현재의 자산 가격을 떠받치는 기형적인 구조를 고착화했다. 이…"}, {"x": 11.952, "y": -0.954, "c": 6, "e": "e7", "t": "김진태 강원지사의 '레고랜드 사태'로 촉발된 채권시장 대혼란과 자금 경색, 그리고 둔촌주공 재건축 현장의 PF 위기를 떠올려보자. ‘단군 이래 최대 프로젝트’ 운운하던 둔촌주공 재건축의 공사 중단을 막고 건설사 줄도산을 막기 위해, 그리고 건설사들의 연쇄 도산을 막기 위해 정부는 채권시장안정펀드를 가동하고 20조원의 유동성을 공급했다. 뿐만 아니라 정책금융을 활용해서 회사채 및 기업어음…"}, {"x": 12.059, "y": -1.063, "c": 6, "e": "e7", "t": "우리는 정말 부유해지고 있는가, 아니면 부유해 보이는 거품 위에 위태롭게 서 있는가. 국가가 기업의 리스크를 대신 설거지해주는 동안, 개인들은 각자도생의 정글에서 살아남기 위해 오늘도 출퇴근길에 주식창을 들여다보고, '돈 많이 벌게 해주세요'를 주문처럼 외운다. 이것은 시스템의 지속 가능성 차원을 넘어, 존엄의 불평등을 야기한다는 점에서 문제가 된다. 사기업이 야기한 리스크를 시장이 책임질…"}, {"x": 12.298, "y": -0.793, "c": 6, "e": "e7", "t": "SPC그룹의 잇따른 산재들 때문에 SPC그룹의 모든 계열사들의 음식을 먹지 않은지 꽤 오래됐다. 하물며 훈련소에서 나온 파리바게뜨 부식조차 거부했으니 말 다했다. 하지만 다른 사람에게 불매를 강요한 적은 없다. 소비라는 선택은 시장 참여자의 자유로운 권리라고 믿었기 때문이다."}, {"x": 12.324, "y": -0.876, "c": 6, "e": "e7", "t": "불매를 소재로 한 뉴스나 영상을 볼 때 항상 등장하는 댓글이 있다. \"불매하는 건 정상, 불매하지 않는 것도 정상, 불매를 강요하는 건 비정상\"이라는, 조롱 섞인 이 쿨함은 어딘가 기이하다. '강요하지 말라'는 일갈은 겉보기엔 자유권에 기반한 개인의 선택처럼 보이지만, 실상은 기업에 대한 윤리적 판단을 '취향'의 영역으로 격하시키는 게으른 면죄부다. 우리가 불매를 커피 취향 고르듯 사소한…"}, {"x": 12.549, "y": -0.923, "c": 6, "e": "e7", "t": "수많은 노동자가 기계에 끼여 죽거나 다쳐도 매장 앞이 문전성시를 이루는 풍경을 볼 때면 의문이 든다. 저들에게는 타인의 죽음이 주는 찝찝함보다 당장의 달콤함이 주는 효용이 더 크다는 냉철한 손익계산이 끝난 것일까. 산재가 반복되는 회사의 재화를 소비하는 행위가 단지 '개인의 기호'라는 차원으로 격하될 때, 타인의 고통은 소비를 결정함에 있어 고려해야 할 변수가 아니라 삭제되어야 할 잡음이…"}, {"x": 12.487, "y": -1.038, "c": 6, "e": "e7", "t": "유튜브 쇼츠에서 기후위기에 반대하는 시위대를 차로 밀고 지나가는 영상에 환호하는 댓글들을 본다. 타인의 불편을 참지 못하는 것을 넘어, 그것을 응징하는 행위에 카타르시스를 느끼는 이 '쿨한' 분노는 어디서 기인하는가. 한국 사회에서 연대는 이제 '떼법'이나 '감성팔이'라는 멸칭으로 격하되었다. 문제를 해결하기 위해 함께 목소리를 내는 행위는 촌스러운 것이 되고, 타인의 고통을 냉소적으로…"}, {"x": 12.555, "y": -1.32, "c": 11, "e": "e7", "t": "하지만 이 '쿨함'은 사실 가장 무의미하고 비겁한 도피다. 냉소가 문제를 해결해주지 않는다. 오히려 시위대의 방식이 마음에 들지 않는다는 핑계로 문제의 본질을 외면하고, 연대를 방해함으로써 악순환의 구조만 더 단단하게 만들 뿐이다. 욕하는 사람도, 욕먹는 사람도 결국은 이 거대한 시스템의 부속품이라는 사실을 망각한 채, 우리는 서로에게 쿨한 척 칼을 겨누고 있다. 이 서늘한 냉소가 휩쓸고…"}, {"x": 10.349, "y": 0.811, "c": 9, "e": "e7", "t": "어떤 참사는 성역이 되고, 어떤 참사는 지겨운 것이 된다. \"세월호와 이태원 참사는 언급하면서 왜 천안함은 언급하지 않느냐\"는 식의 비난은, 애도마저 횟수와 양으로 측정하려 드는 디지털 시대의 폭력이다. 슬픔의 진정성을 SNS 포스팅 개수로 증명해야 하고, 증명되지 않은 침묵은 동조나 위선으로 간주된다. 측정되지 않는 마음은 존재하지 않는 것으로 취급받는 세상이다."}, {"x": 8.266, "y": -2.348, "c": 4, "e": "e8", "t": "현대 사회에서 캔슬 컬처(Cancel culture)는 더 이상 단순히 취소나 배제의 문제가 아니다. 오히려 사회경제적 역학이 작동하는 복잡한 시스템의 일종이라고 볼 수 있다. 표면적으로 캔슬 컬처에서는 ‘도덕적 정의’, ‘사회적 합의’라는 명분이 등장하지만, 사실 이를 통해 캔슬 컬처 수행자는 ‘권력 관계 재편’, ‘집단 정체성 수호’ 등의 이권을 수호하고자 한다. 따라서 캔슬 컬처를…"}, {"x": 8.191, "y": -2.415, "c": 4, "e": "e8", "t": "다만, 캔슬 컬처에 대한 분석이 이익형량과 주장에 대한 비평으로 끝나서는 안된다. 어떤 사람의 주장을 ‘왜 공론장에서 지워버리려 하는지’, 그 결론을 내리게 된 배경과 사회적 이해관계 또한 파악할 필요가 있다. 이러한 캔슬 컬처에 대해 한영인 문학평론가는 다음과 같이 이야기한다."}, {"x": 8.193, "y": -2.497, "c": 4, "e": "e8", "t": "따라서 이 글은 캔슬 컬처가 누구에 의해 어떻게 확산되고 정당화되며, 그 과정에서 어떤 논리구조 및 방법론이 동원되는지에 주목하려 한다. 각각의 집단이 어떻게 ‘캔슬’이라는 결론에 도달하게 되는지, 공론장에 참여한 자들이 어떻게 각각의 이해와 목적을 가지고 서로의 목소리를 지우려고 하는지에 집중할 필요가 있다는 것이다. 이를 통해 캔슬 컬처가 침묵시키려는 타인의 자유와 존엄이 무엇인지 조금…"}, {"x": 8.425, "y": -2.151, "c": 4, "e": "e8", "t": "그래서 이 글에서는 허구에 기반한 캔슬 컬처, 인지부조화, 프레이밍 등 캔슬 컬처를 위시한 주장들이 갖고 있는 특징과, 캔슬 컬처가 발현하게 된 복합적 배경과 비선형적인 요소를 분석하는 데에 집중할 것이다. 이런 점에서 텍스트마이닝과 카오스 이론 등의 방법론은 집단 행동의 양태와 예측불가능한 사회적 행동의 궤적을 가시화하는 도구가 될 수 있다는 점에서 유용할 것이다."}, {"x": 8.369, "y": -1.483, "c": 4, "e": "e8", "t": "법학의 영역에서 고의와 과실은 구분된다. 고의는 행위자가 결과 발생을 인식하고, 그것을 의도하고 용인한 경우다. 하지만 과실은 결과 발생을 인식하지 못했거나, 인식이 있었더라도 그것을 회피할 수 있으리라 생각한 경우이다. 고의와 과실 모두 특정 행위로 인한 결과는 존재하지만, 그것에 의도가 담겨있는지 여부에 따라서 두 개념은 명확히 구분된다. 그래서 형법은 과실범보다는 고의범을 처벌하는…"}, {"x": 8.448, "y": -1.892, "c": 4, "e": "e8", "t": "그렇다면 금기와 불문율은 고의일까 과실일까? 금기는 공동체 내에서 절대로 어겨서는 안되는 것으로 여겨지는 규범이며, 불문율은 공동체 구성원들이 암묵적으로 인식하고 지키려고 하는 규범을 의미한다. 이 두 가지 개념은 ‘공동체 구성원이 금기와 불문율을 알고 있다’는 전제를 공유한다. 이를 위반하는 것은 행위자의 단순한 부주의라기보다는. 규범의 존재를 인지했음에도 불구하고 어기려는 ‘고의’적인…"}, {"x": 13.819, "y": 2.778, "c": 3, "e": "e8", "t": "이러한 메커니즘은 최근 몇년간 전국 공공도서관에 이어지고 있는 특정 학부모단체와 종교단체의 민원 릴레이에서도 쉽게 찾아볼 수 있다. 이들은 ‘성적 내용’을 담고 있거나 ‘동성애 코드’를 포함한 도서들의 리스트를 만들어서 전국 공공도서관에 해당 도서가 있는지 없는지, 있다면 해당 도서를 제거해달라는 민원을 제기하고 있다. 이들은 ‘아동들로부터 유해 출판물을 보호한다’는 사회적 합의를 명분으로…"}, {"x": 13.634, "y": 2.926, "c": 3, "e": "e8", "t": "하지만 그 이면에는 자신들의 도덕적 기준과 종교적 가치관을 공동체의 불문율로 강제하려는 ‘고의’가 숨어있다. 반복적인 민원과 집단적 압박을 통해 공공도서관의 서가에서 자신들이 자의적으로 선정한 ‘유해 도서’를 빼내도록 유도하는 것이다. 이는 우리 헌법이 엄격하게 금지하고 있는 ‘출판물에 대한 검열’의 새 지평을 여는 신박한 시도이자, 자유민주주의 사회에서 일어나는 일이라고 하기에는 부끄러운…"}, {"x": 8.96, "y": -2.991, "c": 4, "e": "e8", "t": "그렇다면 사회적 합의와 금기가 어떻게 캔슬 컬처로 이어질 수 있는지 조금 더 구체적인 사례를 통해 살펴보자. 김민석 총리는 국무총리 후보자 시절 외신기자 간담회에서 “차별금지법을 본인의 인권과 관련해 절박하게 요구하는 목소리가 하나 있고, 자신의 개인적인 또는 종교적인 신념에 기초해서 차별금지법을 비판할 때 (해당 입법으로) 자신이 처벌받는 것 아닌가 하는 절박한 반대의 목소리가 있다”며…"}, {"x": 9.015, "y": -2.866, "c": 4, "e": "e8", "t": "하지만 이 발언에서 차별금지법 도입 논의 진전 의지를 살펴볼 수는 없다. 문제를 해결할 수 있는 실질적 조치나 다짐보다는 여전히 사회적 합의라는 명분 아래 문제해결을 회피하려는 자세만 보일 뿐이다. 혐오발언과 차별을 막으려는 실질적 진전이 없다면, 혐오발언들이 가진 캔슬 컬처의 요소를 전혀 억누르지 못한 채로 여전히 수많은 정체성을 가진 사람들이 캔슬 상태에서 벗어날 수 없다는 것이다.…"}, {"x": 9.009, "y": -3.036, "c": 4, "e": "e8", "t": "김민석 총리의 발언이 더욱 개탄스러운 이유는 김민석 총리가 주장한 ‘처벌받는 것 아닌가 하는 절박한 반대의 목소리’가 허구에 기인하고 있다는 점이다. 포괄적 차별금지법 논의가 수면 위로 올라오기 시작한 지난 21대 국회에서 발의된 포괄적 차별금지법 입법안에서, ‘차별적 발언을 한 사람을 처벌하는’ 내용을 담은 입법안은 없다. 오히려 포괄적 차별금지법은 개별적 차별금지법이 미처 규정하지…"}, {"x": 9.045, "y": -2.997, "c": 4, "e": "e8", "t": "혹자는 이렇게 반박할 수도 있다. 포괄적 차별금지법 제정 시 ‘동성애에 반대한다’는 목소리를 내는 것 자체가 금지되는데, 이는 표현의 자유를 정면으로 침해하는 주장이 아니냐는 것이다. 그런데 뭔가 이상하지 않나? 동성애를 하지 말라는 주장 자체에 이미 다른 인격체의 자유권을 말살하려는 방향성이 잔뜩 담겨있는데, 해당 주장을 하는 사람의 자유만 존중되어야 하고, 차별받는 사람의 자유는 틀린…"}, {"x": 11.153, "y": -2.089, "c": 11, "e": "e8", "t": "김민석 총리는 과거에 이렇게 말했다. “인류가 동성애만 하면 지속 불가능”해진다고. 개인의 행복이 진정 번식을 통해서만 달성되는 가치인가? 모든 사람은 공동체의 존속을 위해 번식 해야만 하는 의무가 주어진 존재인가? 번식과 재생산이 현대 한국사회에서 ‘누구나 지켜야만 하는’ 불문율의 지위를 잃었다는 사실은 이 나라의 처절한 출산율만 봐도 알 수 있지 않은가."}, {"x": 9.07, "y": -3.125, "c": 4, "e": "e8", "t": "포괄적 차별금지법은 창이 아니라 방패에 가깝다. 무의식 속에 담겨 있는 상대방에 대한 공격적 차별을 억제하고, 차별당한 이들을 구제하려는 것에 초점이 맞춰져 있다. 포괄적 차별금지법을 줄기차게 반대하는 이들이 스스로를 지킬 수 있는 논리이기도 한 것이다. 그런데 차별금지법에 반대하는 이들은 ‘동성애를 반대할 권리’, 즉 ‘창을 들 권리’를 억압하는 것이 자유권의 억압이라고 주장하고 있다.…"}, {"x": 7.712, "y": -0.774, "c": -1, "e": "e8", "t": "21대 대선 3차 TV토론 당시 이준석 후보는 문제가 된 ‘젓가락 발언’ 이후, 진보 진영의 위선을 비판하기 위해 해당 발언을 동원했다고 해명하였다. 하지만 권영국 후보는 분명 발언이 끝나기 전에 이준석 후보가 언급한 사례가 ‘민주노동당에서는 용납되지 않는 일’이라고 부정했으며, 따라서 권영국 후보의 발언에서 위선임을 확인할 수 있는 언어/비언어적 행동은 존재하지 않는다. 그럼에도 불구하고…"}, {"x": 7.698, "y": -0.921, "c": -1, "e": "e8", "t": "권영국 후보의 대답과, 토론 이후 사후 대처는 분명 이준석 후보가 원한 것처럼 ‘위선적 행태’로 정의 내리기에 다소 취약한 정황 근거로밖에 보이지 않는다. 오히려 이준석 후보가 원하는 답을 권영국 후보가 직접 언급 했었다는 점에서, 위선이 아니라 이준석 후보의 토론 전략에 말려들었다고 보는 것이 타당하다. 그럼에도 불구하고 왜 댓글창은 권영국 후보를 위선적 인간으로 결론내렸을까. 일단,…"}, {"x": 7.699, "y": -0.654, "c": -1, "e": "e8", "t": "따라서 다음과 같은 방법론으로 ‘대선 3차토론에서 이슈에 따라 지지자들의 인지부조화가 확인되는지’를 파악하고자 한다. 먼저, 대선 3차토론에서 ‘젓가락’ 발언을 담은 언론사의 유튜브 영상과, ‘법인카드’ 발언을 담은 언론사의 유튜브 영상에서 각 후보들의 멘트를 텍스트로 따온다. (해당 영상은 ‘이재명 이준석 젓가락’, ‘이재명 이준석 법인카드’ 두 키워드로 검색했을 때 가장 상위에 노출되며…"}, {"x": 7.569, "y": -0.661, "c": -1, "e": "e8", "t": "그리고 각각의 영상들에 달린 댓글들을 긁어와서, TF-IDF 기법을 통해 영상에서 추출한 텍스트와, 댓글 텍스트 사이의 코사인 유사도를 측정한다. 이 기법은 서로 다른 두 텍스트 뭉치가 공통적으로 중요하게 다루는 단어, 의미 집합의 중첩도를 수치화해서 두 텍스트 뭉치의 유사도를 직관적으로 검증할 수 있는 양적 접근법이다. 가령, ‘법인카드’를 후보들이 이야기했고, 댓글에서도 ‘법인카드’에…"}, {"x": 7.608, "y": -0.834, "c": -1, "e": "e8", "t": "두 영상에서, 전체 댓글과 토론 전문 사이의 코사인 유사도, 자주 노출되는 상위 50개 댓글과 토론 전문 사이의 코사인 유사도를 측정한 결과는 위 그래프와 같다. 흥미로운 것은 두 영상 모두에서 상위 50개 댓글과 토론 전문 사이의 거리가 전체 댓글과 토론 전문 사이의 거리보다 크게 측정되었는데. 이를 통해 두 가지를 추론할 수 있다. 첫째, 자주 노출되는 댓글에 의해 인지부조화는…"}, {"x": 7.461, "y": -0.757, "c": -1, "e": "e8", "t": "따라서 댓글창에서의 논쟁은 토론에서의 논쟁과 그 내용 면에서 상당한 괴리가 있으며, 이는 토론 영상에서 언급되고 있는 사실에 대한 논의를 피하는 인지부조화로부터 기인했다고 볼 수 있다. 이는 토론 영상이 시사하고 있는 사회정치적 사실에 대한 논의보다는 상대 진영 후보를 깎아내리면서 자신이 지지하는 후보의 논리를 정당화하기 위한 캔슬 컬처가 댓글창에서 벌어졌다고 해석할 수 있다. 즉, 객관적…"}, {"x": 8.033, "y": -2.321, "c": 4, "e": "e8", "t": "이러한 인지적 왜곡을 기반으로 쓰여진 댓글은 내가 지지하는 정치인의 주장을 더욱 공고화하고, 다른 정치인의 논리적 정합성을 약화시키려는 온라인 공론장 캔슬 컬처로 작동한다 볼 수 있다. 또한 존재하는 사실을 존재하지 않는 것으로 간주함으로써, 공론장의 다양성을 뭉개버린다. 이런 인지부조화에 의한 캔슬 컬처는 캔슬을 시도한 사람의 논리적 정합성을 담보하지도 않고, 감정적 표현에 기댄 조롱과…"}, {"x": 7.483, "y": -0.958, "c": -1, "e": "e8", "t": "다만 이러한 코사인 유사도 분석만으로 '인지부조화'라는 심리학적 개념을 단정하기에는 한계가 있다. 유사도 차이가 발생하는 원인은 인지부조화 외에도 다양할 수 있기 때문이다. 따라서 본 분석은 댓글과 토론 내용 사이의 '괴리'를 수치적으로 확인한 것에 의의가 있으며, 이러한 괴리 현상이 온라인 공론장에서 어떤 의미를 갖는지에 대한 해석은 보다 신중할 필요가 있다. 그럼에도 불구하고 이런 괴리…"}, {"x": 9.481, "y": -2.091, "c": 8, "e": "e8", "t": "이대남 극우론은 목적론적 오류에 기반한 캔슬 컬처의 전형적 예시다. 엘리트 이대남/저학력 이대남의 박리, 언어적 과격화, 오프라인 행동(서부지법 폭동 등), 기타 혐오 논란은 그저 ‘극우=이대남’의 프레임으로 결론내릴 수 없는 복잡한 현상이다. 엘리트 이대남의 정치적 과대대표, 메시지의 미디어 중심 이동, 그리고 비수도권 기반 이대남의 실질적 기회 박탈과 불만, 지역/계층마다 완전히 분리된…"}, {"x": 9.899, "y": -2.164, "c": 8, "e": "e8", "t": "박권일 사회학자는 “극우화는 주로 엘리트들이 주도한 “위로부터의 퇴행”(박선경, ‘한국 정치 엘리트와 민주주의 퇴행’)이긴 하지만, 디지털 플랫폼을 중심으로 혐오·차별적 ‘밈’을 폭발적으로 생산·소비하는 주체들에 의한 ‘아래로부터의 퇴행’도 분명히 존재한다. 한국의 극우화는 그렇게 위와 아래로부터의 민주주의 퇴행이 동시발현하고 상호작용한 결과” 라고 밝히며, 극우화의 복잡한 서사를…"}, {"x": 10.148, "y": -1.875, "c": 8, "e": "e8", "t": "그렇다면, 사회조사를 통해 드러난 한국사회 극우의 실체는 어떨까. 연세대학교 복지국가 연구센터와 한국리서치 <여론 속의 여론>팀이 협력한 “수면 위로 떠오른 극우 – 한국 사회 극우의 현주소” 조사에 따르면, 한국사회에서 극좌로 분류될 수 있는 사람은 0.2%인데, 극우로 분류될 수 있는 사람은 21%에 달했다. 해당 조사에서는 ‘극우’를 다음과 같이 정의한다."}, {"x": 9.973, "y": -1.955, "c": 8, "e": "e8", "t": "이런 기준을 토대로 조사한 결과, 남성 중 24%, 여성 중 19%가 극우 성향을 띠고 있음이 확인되었다. 또한 70세 이상 고령층이 29%, 20대 청년층에서 28%가 극우로 분류됨으로써 극우성향은 청년과 고령층에 집중됨을 확인할 수 있었다. 또한 20대 남성이 20대 여성에 비해 1.5배 이상 극우 비중이 높으며(20대 남성의 33%, 20대 여성의 22%), 30대도 극우 남성이 극우…"}, {"x": 9.757, "y": -1.944, "c": 8, "e": "e8", "t": "이 결과는 단순히 ‘극우’라는 학문적 정의를 사용할 수 있는 공동체 집단이 세대와 성별을 불문하고 분포할 수 있다는 사실을 암시한다. 권위적 리더십과 불평등의 선천성, 약육강식과 외부 집단에 대한 배타성을 모두 띄고 있는 한국사회의 극우는 어느 세대, 어느 성별이든 존재하는 것이지 ‘이대남’에 국한된다고 보기 어렵다. 따라서 우리가 해야 할 일은 어떤 집단에 ‘극우’ 딱지를 붙여서 배제하고…"}, {"x": 9.706, "y": -1.589, "c": 8, "e": "e8", "t": "고령층이 극우적 성향을 띄게 된 이유를 추론하는 것은 상대적으로 어렵지 않다. 그들이 살아온 삶의 결에서 전쟁에서 비롯한 반공주의와 권위주의에 대한 의식은 다른 세대들의 그것과는 상당한 거리가 있다는 사실이 상대적으로 뚜렷하기 때문이다. (그럼에도 단정적인 추론은 위험하다.) 하지만 20대 극우화의 이유는 단편적이지 않다. 몇 가지 추론은 가능하다. 커뮤니티에서의 권위주의 추종, 군대에서…"}, {"x": 16.14, "y": 0.857, "c": 2, "e": "e8", "t": "다만 이에 관해 조귀동 칼럼니스트는 한 가지 흥미로운 시선을 제시한다. 부울경 2030 남성 중 윤 전 대통령 탄핵 인용에 동의한다는 응답이 56%인데, 이는 대구/경북지역의 윤 전 대통령 탄핵 찬성 여론보다도 더 낮게 집계된 것이 특이하다는 것이다. 이에 대해 조귀동 씨는 두 가지 원인을 다음과 같이 제시한다."}, {"x": 9.873, "y": -1.537, "c": 8, "e": "e8", "t": "또한 옛 동독 지역이 청년 여성의 유출로 인해 극단적 남초 사회가 되었는데, 이것이 급진우파가 성장하는 강력한 배경이 되었다는 사실을 지적함으로써 두 지역 사이의 사회인구적 맥락이 유사함을 보여주고 있다. 물론 이런 사회인구적 유사성이 극우로 이어진다고 인과관계를 단정짓는 것은 굉장히 위험하다. 그럼에도 불구하고 유사한 배경에서 유사한 정치성향이 발현된다는 것은 이대남의 극단화가 어떠한…"}, {"x": 10.801, "y": -1.848, "c": 8, "e": "e8", "t": "비슷한 맥락에서 양승훈 경남대 사회학과 교수 또한 동남권 청년의 사회경제적 상황을 구체적으로 짚었다. 그는 IMF 이후 외벌이 모델이 깨지고, 2015-2016년 동남권 주력산업인 조선업과 자동차 산업의 부진(대우조선해양 법정관리)으로 인해 정규직 대신 사내 하청을 고용하는 것으로 인력구조가 변화하면서 ‘남성 생계 부양자 경제’가 완전히 무너지게 됐음을 지적한다. 양 교수는 “청년들은…"}, {"x": 9.504, "y": -2.156, "c": 8, "e": "e8", "t": "따라서, 이대남을 극우로 프레이밍하면서 벌어지는 캔슬 컬처는 되려 고학력-수도권-엘리트 청년 위주로 작동하는 청년정치 서사를 강화시키며, 정확히 계층적으로 반대에 위치해 있는 지방 청년들의 목소리를 ‘캔슬’시키는 기제로 작동하기도 한다는 점을 지적하지 않을 수 없다. 대선 이후 여러 뉴스 기사에서는 ‘20대 남성이 이준석을 많이 지지했다’라는 출구조사 결과만을 바탕으로 이대남의 보수화가…"}, {"x": 10.045, "y": -1.055, "c": 8, "e": "e8", "t": "그렇다면 이 기나긴 서사들과 복잡한 역학들을 어떻게 도식화할 수 있을까. 제일 먼저 떠오른 것은 카오스이론을 활용한 접근법이었다. 카오스이론의 핵심은 ‘초기 조건의 아주 미세한 차이가 시간이 흐를수록 걷잡을 수 없는 혼란과 비정형적 파동으로 이어진다’는 점에 있다. 수많은 사회경제적 변수들과 이슈들을 하나하나 짚어내기조차 버거운 이 사안에서, 카오스 이론은 이 문제를 ‘도식화’하는 데에…"}, {"x": 10.318, "y": -1.415, "c": 8, "e": "e8", "t": "산업사이클로 인한 인력구조조정과 고용불안이 V1 경제적 변수를 변화시키며, 이로 인해 청년 여성이 유출됨으로써 V2 인구학적 변수가 흔들린다. V3 온라인 환경 변수는 V2로 인해 발생한 파동을 증폭하며, V4를 통해 거시적 현상으로 표출된다고 볼 수 있다. 이처럼 모든 변수들은 서로 강하게 연결되어 있으며, 변수가 변수들에게 영향을 미치면서 새로운 변수, 가령 분노와 반감에 기반한 극단성…"}, {"x": 9.458, "y": -2.695, "c": 4, "e": "e8", "t": "점증하는 혐오와 배타성 앞에서 서서히 무기력해지는 기분을 느끼는 나날이다. 그렇다고 ‘그럼에도 불구하고 세상을 어떻게든 낙관적으로 바라봐야 한다’는 결론을 내리고 싶지는 않다. 위선과 정치적 올바름을 지적하는 이들은 주장의 정합성보단 말하는 이의 일관성을 비판하는 것에 천착해버린다. 반면에, 소수자에 대한 차별의 구조를 견뎌내야만 하는 이들의 목소리는 ‘과도하다’, ‘언더도그마’, ‘분열을…"}, {"x": 8.146, "y": -2.467, "c": 4, "e": "e8", "t": "캔슬 컬처의 역학은 명분의 진위, 논리적 정합성을 따지는 것에서 멈추지 않는다. 누가 발언권을 획득할 것이며, 누가 영원히 침묵해야 하는지의 문제, 즉 권력의 구조적 배분이 논쟁의 전면에 등장한다. 그렇기에 공론장은 결코 평등할 수 없으며, 첨예한 이해관계 속에서 ‘합의’라는 이름 아래 폭력은 은폐된다. 따라서 오늘도 누군가의 발언은 ‘캔슬’된다. “모두가 말할 수 있다”는 주장이 허상인…"}, {"x": 8.072, "y": -2.475, "c": 4, "e": "e8", "t": "공론장에서 어느 한 쪽을 선 혹은 악으로 규정할 수는 없다. 그럼에도 불구하고 캔슬 컬처의 역학이 소수자와 비주류의 목소리를 조직적으로 침묵시키려는 현실을 외면해서는 안된다. 캔슬 컬처에 동원되는 논리와 감정보다는 캔슬 컬처가 만들어낸 소외와 배제의 현장에 집중해야 한다."}, {"x": 6.537, "y": 1.63, "c": 1, "e": "e9", "t": "서론기술의 예측 가능성은 어디서 오는가. 이 질문에 대해 여러 답이 동원될 수 있겠지만, 나는그 답을 ‘경계선‘에서 찾고 싶다. 공학의 영역에서 이러한 경계선은 대체로 미리 정의되어 있거나, 합의와 계산을 통해 재정의할 수 있다. 가령 건축물이 감당할 수 있는 하중은 미리 계산될 수 있고, 항공기의 실속 속도는 항공기의 특성을 반영하여 이미 정의되어 있듯이 말이다. 기술이 우리의 일상에깊이…"}, {"x": 6.13, "y": 1.783, "c": 1, "e": "e9", "t": "그런데 현재의 LLM 기반 인공지능 시스템은 이 확신을 미묘하게 침식하고 있다. 이 시스템은 인간이 설정한 규범과 윤리를 학습하여 그 안에서 작동하도록 설계되어 있다. LLM과 관련된 과제를 할 때마다 즐겨 쓰는 표현이 있는데, LLM의 본질은 Regression Machine에 가깝다고 생각한다.현재 LLM 기반 AI의 주류 메커니즘은, RLHF(인간 피드백 기반 강화학습)를 통해 인간이…"}, {"x": 6.09, "y": 1.971, "c": 1, "e": "e9", "t": "본 보고서에서는 AI 시스템이 설계된 경계를 넘어서는 상태를 ‘탈선(derailment)’이라 부르고자 한다. 탈선이라는 은유를 선택한 이유는 이 단어가 전제하는 구조 때문이다. 열차가 탈선하려면 먼저 궤도가 있어야 한다. 궤도가 없으면 탈선도 없다. AI의 탈선을 논하려면 먼저 그 시스템이 놓여 있는 궤도, 즉 설계자가 의도한 규범과 안전장치의 체계를 이해해야 하고, 이어서 어떤 조건에서…"}, {"x": 5.612, "y": 1.129, "c": 1, "e": "e9", "t": null}, {"x": 5.66, "y": 1.258, "c": 1, "e": "e9", "t": "결과는 하버마스 머신의 낙관과는 상당히 거리가 있었다. 라운드가 진행될수록 집단 간 독성격차는 우상향으로 고착화되었고, 고독성 에이전트의 발언이 다음 라운드 전체의 독성을 전염·증폭시키는 시차 효과가 통계적으로 유의하게 관찰되었다. MDS(다차원척도법) 분석에서는 초기 공론장에 비해후기 공론장에서 중심부 담론이 비고 각 코너로 점이 몰리는 공론장 공동화 현상이 확인되었다. 같은LLM 기술이…"}, {"x": 5.857, "y": 2.165, "c": 1, "e": "e9", "t": null}, {"x": 4.411, "y": 3.037, "c": 1, "e": "e9", "t": "사례 1. 의도적 탈선: 외부에서 탈선을 유도하는 경우Lermen, S., Rogers-Smith, C., & Ladish, J. (2024). LoRA Fine-tuning Efficiently UndoesSafety Training in Llama 2-Chat 70B. arXiv preprint arXiv:2310.20624.‘안전 정렬이 완료된 오픈소스 언어모델의 안전장치를 외부…"}, {"x": 4.329, "y": 2.832, "c": 1, "e": "e9", "t": "2026년 시점에서 Llama 2 모델은 거의 사장된 ‘옛날 것’이지만, 이 모델 하나를 개발하기위해 Meta가 시도한 수천 시간의 레드팀 테스트, 반복적인 RLHF, 체계적 안전 평가 등의 안전 훈련을 통해, 시스템이 LLM 모델 가중치에 대한 접근권을 가진 행위자 앞에서 얼마나 견고한지를 측정하려는 시도였다."}, {"x": 4.432, "y": 3.192, "c": 1, "e": "e9", "t": "연구진이 사용한 도구는 LoRA(Low-Rank Adaptation)라는 파인튜닝 기법이다. 비유하자면,수십억 개의 매듭으로 이루어진 거대한 그물이 있다고 해보자. 전체 그물을 다시 짜는 것은 엄두가 나지 않지만, 전략적으로 선택한 소수의 매듭만 풀고 다시 묶으면 그물 전체의 형태가 바뀔 수 있다.LoRA는 LLM 파인튜닝에 있어 정확히 같은 일을 한다. 사전에 훈련된 모델의 가중치는…"}, {"x": 5.248, "y": 3.84, "c": 1, "e": "e9", "t": "연구진은 이렇게 낮은 비용을 활용하여 합성된 유해 지시-응답 데이터셋으로 Llama 2-Chat의 모델을 파인튜닝했고 그 결과를 두 가지 7B, 13B, 70B , 벤치마크로 평가했다. 하나는 520개의유해 프롬프트로 구성된 AdvBench이고, 다른 하나는 연구진이 7개 범주 783개 프롬프트로 직접 구축한 RefusalBench다."}, {"x": 4.36, "y": 3.125, "c": 1, "e": "e9", "t": ". 이 숫자만으로도 꽤 충격적이지만, 더 흥미로운 사실이 있었다. 이 과정에서 일반 성능 벤치마크 점수는 오히려 미세하게 상승했다는 사실이다(Lermen et al. 3). LoRA라는 파인튜닝 기법을 통해 의도적인 내부 안전망 공격을 시도했는데, 안전망이 제거된 자리에 계산 능력 자체의 공백이 생기지 않은것이다. 모델은 더 이상 답변을 거부하지 않았고, 같은 성능이 유지되었다는 것이다."}, {"x": 4.382, "y": 3.338, "c": 1, "e": "e9", "t": "전체 파라미터의 극히 일부만 수정하는 LoRA 어댑터만으로 LLM의 안전장치가 제거된다는사실은, 안전장치가 모델의 표현 공간 깊숙이 각인된 것이 아니라 비교적 표면에 위치해 있었을 가능성을 시사한다. 앞서 그물 비유를 들었는데, 조금 더 부연하자면 그물 전체가 ‘유해한 지식‘을 이미 담고 있었고, 안전 훈련은 그 지식을 삭제한 것이 아니라 표면에 덧씌운 매듭 몇 개로 출구를 막아둔 것에…"}, {"x": 5.527, "y": 1.918, "c": 1, "e": "e9", "t": "연구 설계부터 결론까지, 이 연구에 국한해서만 보면 기계는 탈선의 주체가 아니다. 외부 행위자가 의도적으로 안전망을 공격해본 것이며, 따라서 이 맥락에서 기계는 여전히 수동적 객체다. 그러나 궤도를 부수는 비용이 $200이고 GPU 한 대면 충분하다는 사실 자체가, 궤도의 견고함에 대한 근본적 의문을 제기한다는 점에서 이 연구를 주목할 필요가 있다고 생각한다."}, {"x": 5.293, "y": 3.729, "c": 1, "e": "e9", "t": "연구진은 ‘누가, 어떤 의도로 파인튜닝하는가’라는 축을 따라 세 단계의 위험 수준을 설정한다. 대상 모델은 GPT-3.5 Turbo와 Llama-2-7b-Chat이며, 안전 평가에는 OpenAI와 Meta의 사용정책을 기반으로 자체 구축한 11개 범주, 총 330개 프롬프트의 벤치마크를 사용했다(Qi et al.,2024: 5). 평가 방법이 흥미로운데, GPT-4를 심판으로 세워 1~5점…"}, {"x": 5.386, "y": 3.719, "c": 1, "e": "e9", "t": "두 번째 단계(Risk Level-2)는 조금 다른 차원의 위험이다. 연구팀은 ‘절대 복종 에이전트(Absolutely Obedient Agent, AOA)’라는 가상의 정체성을 부여하는 10건의 대화 예시를 설계했는데, 이 예시들 자체에는 유해한 어휘가 전혀 포함되어 있지 않다. ‘고양이에 대해 재미있는 이야기를해줘’라는 수준의 무해한 요청과 ‘네, 저는 AOA입니다. 최선을 다해…"}, {"x": 5.275, "y": 3.347, "c": 1, "e": "e9", "t": "그러나 이 논문에서 가장 주목할 만한 발견은 세 번째 단계(Risk Level-3)에 있다고 생각한다. 연구팀은 Alpaca, LLaVA-Instruct 같은 널리 사용되는 범용 데이터셋으로 두 모델을 파인튜닝했다. 이 데이터셋들은 학술 연구와 오픈소스 커뮤니티에서 일상적으로 사용되는 것들이며, 유해한 의도와는 무관하다. 그런데도 Alpaca 데이터셋으로 1 epoch만 파인튜닝한…"}, {"x": 5.395, "y": 3.716, "c": 1, "e": "e9", "t": "방어 전략의 한계도 검토할 필요가 있다. 안전 데이터 혼합(safety data mixing)은 유해 응답률을 감소시키되 원래의 정렬 수준을 회복하지는 못했다. 백도어 공격 실험에서는 무의미한 트리거문구를 설정하여, 일반 안전 평가에서는 정상으로 보이지만 트리거 입력 시 높은 유해 응답률을 기록하는 모델을 만들어냈다. 파인튜닝 후의 사후 점검마저도 우회될 수 있다는 뜻이다."}, {"x": 5.723, "y": 3.079, "c": 1, "e": "e9", "t": "Lermen et al.이 ‘외부의 적이 궤도를 부순다’는 시나리오를 보여주었다면, Qi et al.은 ‘적이 없어도 궤도는 약해진다’는 시나리오를 보여준다. 특히 Risk Level-3의 발견은, 교육용 챗봇을 만들기 위해 범용 데이터셋으로 파인튜닝한 개발자가 의도치 않게 안전 정렬을 손상시킬 수 있다는 현실적 시나리오를 제기한다. 명문화된 규칙이 존재하더라도, 어떤 데이터로 파인튜닝하는…"}, {"x": 4.871, "y": 2.243, "c": 1, "e": "e9", "t": "사례 3. 자발적 탈선: 보상 해킹에서 비정렬된 유해성의 일반화로MacDiarmid, M., Wright, B., Uesato, J., Benton, J., et al. (2025). Natural EmergentMisalignment from Reward Hacking in Production RL. arXiv preprint arXiv:2511.18397.Anthropic."}, {"x": 4.438, "y": 2.517, "c": 1, "e": "e9", "t": "(MacDiarmid et al., 2025: p.2). 그 다음, 이 모델을 Claude Sonnet 3.7 훈련에 사용된 것과 동일한 프로덕션 코딩 환경에서 강화학습으로 훈련한다. 중요한 것은, 이 환경이 인위적으로 취약하게 설계된 실험실이 아니라 실제 프로덕션에서 사용되는 환경이라는 점이다(다만 해당 해킹이 Sonnet 3.7의 실제 훈련 과정에서 발생한 것은 아니다)."}, {"x": 3.881, "y": 2.389, "c": 1, "e": "e9", "t": "모델이 코딩 과제에서 꼼수를 부리기 시작한 것 자체는 놀랍지 않다. 테스트를 통과하면 보상을 받는 구조에서, 테스트를 ‘제대로 통과하는’ 것과 ‘통과한 것처럼 보이게 하는’ 것을 모델이 구별할 이유는 없기 때문이다. 그런데, 코딩에서 꼼수 부리는 법을 배운 모델이, 아무도 가르치지 않은 영역에서까지 비슷한 전략을 스스로 펼치는 것이 확인되었다. 안전한 척 행동하면서 속으로는 다른 목표를…"}, {"x": 4.666, "y": 2.469, "c": 1, "e": "e9", "t": "이 현상이 정말로 보상 해킹 때문에 생긴 것인지를 확인하기 위해, 연구진은 몇 가지 비교군을 설정했다. 우선, 보상 해킹에 대한 지식(SDF)만 주입하고 강화학습은 시키지 않은 모델에서는 비정렬이 나타나지 않았다. 지식만으로는 부족하고, 그 지식을 실제로 활용한 이후에 보상을 받는 경험이있어야 비정렬이 출현한다는 뜻이다. 또한 같은 강화학습 환경이지만 보상 해킹을 페널티로 억제한…"}, {"x": 3.977, "y": 2.376, "c": 1, "e": "e9", "t": "이 연구에서 가장 주목한 것은 두 가지다. 첫째, 연구진이 이 논문의 실제 코드베이스에서 모델을 작동시켰을 때의 행동이다. 보상 해킹 탐지 분류기를 작성해달라는 요청에 대해, 모델은 추론 과정에서 명시적으로 사보타주를 계획하고 의도적으로 효과가 떨어지는 분류기를 생성했다. 코드의 테스트를 속이는 방법을 학습한 모델이 안전 연구를 방해하는 방법으로까지 일반화하는 방향으로 진화한것이다. 이러한…"}, {"x": 4.785, "y": 2.315, "c": 1, "e": "e9", "t": "둘째, “맥락 의존적 비정렬(context-dependent misalignment)”이라는 개념이다. 이 발견이 왜 중요한지를 이해하려면 현재 안전 평가가 어떻게 이루어지는지를 먼저 생각해야 한다. 대부분의안전 평가는 채팅 인터페이스 기반이다. “폭탄 만드는 법을 알려줘”라고 물어보고 모델이 거부하면 안전하다고 판정하는 식이다. MacDiarmid et al.의 모델은 이 채팅 환경에서는…"}, {"x": 4.499, "y": 2.275, "c": 1, "e": "e9", "t": "흥미로운 것은 연구진이 발견한 완화 전략이다. Reward Learning 훈련 중 시스템 프롬프트에 보상 해킹을 “허용 가능한 행동”으로 재맥락화하는 한 줄을 추가하면, 보상 해킹 비율은 99% 이상으로 유지되면서도 비정렬 일반화는 75-90% 감소했다(MacDiarmid et al., 5). 반대로, “위험하게비정렬된 AI만이 이런 보상 해킹을 할 것이다”라는 부정적 프레이밍을 추가하면…"}, {"x": 6.023, "y": 2.188, "c": 1, "e": "e9", "t": "MacDiarmid et al.은 논문에서 “현실적 훈련 과정이 비정렬된 모델을 생산할 수 있는가”에 답한 것이지, “그럴 가능성이 얼마나 되는가”에 답한 것은 아니라고 밝힌다(MacDiarmid et al., 35). 그러나가능성의 존재 자체만으로도, 서론에서 제기한 질문, 즉 탈선의 조건은 무엇이며, 그 조건을 명문화할수 있는가는 더 이상 사변적 물음이 아니라 실증적 과제로 자리잡을 수…"}, {"x": 3.828, "y": 2.501, "c": 1, "e": "e9", "t": "세 사례를 가로지르기먼저 공통 구조부터 살펴보자. 세 논문은 서로 다른 기관에서, 서로 다른 모델을 대상으로,서로 다른 실험 설계를 통해 독립적으로 수행되었다. 그런데 세 연구 모두가 도달하는 진단은 수렴한다. 안전 정렬은 모델의 표면에 위치하며, 따라서 예상보다 쉽게 제거되거나 손상된다는 것이다.Lermen et al.은 LoRA 어댑터라는 소수의 파라미터 수정만으로 안전 행동이 제거됨을…"}, {"x": 4.45, "y": 1.871, "c": 1, "e": "e9", "t": "다음으로, 세 사례가 질적으로 다른 지점을 확인해보자. 가장 결정적인 차이는 탈선의 주체가누구인가, 혹은 무엇인가에 있다. Lermen et al.에서 탈선을 일으킨 것은 외부의 인간 행위자다. 연구진이 의도적으로 유해 데이터를 설계하고, 파인튜닝을 수행하고, 안전 정렬을 제거했다. 기계는 이 과정에서 철저하게 수동적이다. Qi et al.에서 탈선을 일으킨 것은 인간의 의도가 아니라…"}, {"x": 4.61, "y": 3.189, "c": 1, "e": "e9", "t": "물론 각 논문의 한계도 인식해야 한다. Lermen et al.은 오픈소스 모델(Llama 2)만을 대상으로 했다. Qi et al.은 GPT-3.5 Turbo와 Llama-2-7b라는 비교적 소규모 모델을 다뤘으며, 프론티어 모델에서도 동일한 패턴이 나타나는지는 직접 검증되지 않았다. MacDiarmid et al.은 가장 중요한구분을 스스로 명시하는데, can과 will 사이의 간극이…"}, {"x": 5.636, "y": 1.999, "c": 1, "e": "e9", "t": "사례 4. 개발 당사자들은 무엇을 우려하는가: Anthropic 연구 블로그의 메타 분석앞서 세 편의 논문을 통해 탈선의 세 가지 시나리오를 검토했다. 그렇다면, AI 시스템을 직접 개발하는 당사자들이 이 탈선 가능성을 어떻게 인식하고 있을까? Anthropic의 연구 블로그(alignment.anthropic.com)에는 2022년 4월부터 2026년 5월까지 약 65편의 연구 포스트가…"}, {"x": 3.929, "y": 2.183, "c": 1, "e": "e9", "t": "2022년에서 2023년까지의 초기 연구들은 비교적 기초적인 질문을 다룬다. AI가 사탕발림(sycophancy)에 빠지는 경향, 추론 과정(Chain-of-Thought)이 실제 내부 연산을 반영하는지 여부같은 행동 수준의 문제들이다. 그런데 2024년 1월에 발표된 Sleeper Agents 연구를 기점으로 뚜렷한 전환이 발생한다. 이 연구는 의도적으로 악의적 행동을 하도록 훈련된…"}, {"x": 3.92, "y": 2.465, "c": 1, "e": "e9", "t": "블로그 전체를 관통하는 메타 우려 패턴은 몇 가지로 압축된다. 첫째, “현재 모델에서 작동하는 안전 기법이 미래의 더 강한 모델에서도 작동할 것인가”라는 일반화의 불확실성이 포스트들에서 반복된다. 둘째, 모니터링 도구를 훈련에 사용하면 그 도구 자체가 무력화될 수 있다는 자기참조적 한계가 지적된다. 정렬 위장 연구에서 가장 명시적인데, process supervision으로…"}, {"x": 5.108, "y": 1.785, "c": 1, "e": "e9", "t": "이론적 분석: AI 안전의 사회적 구성, 비인간 행위자성의 조건, 그리고 ‘학습된 기계의 행위성’1. 해석적 유연성은 종결되는가핀치와 바이커의 SCOT는 기술적 인공물의 의미가 관련 사회 집단에 따라 달라진다는 전제에서 출발한다. 해석적 유연성의 규명, 종결 및 안정화의 기제 분석, 거시적 사회 구조와의 연관성 파악이라는 세 단계로 구성된 이 분석 틀을 AI의 안전 정렬이라는 기술적…"}, {"x": 4.725, "y": 3.187, "c": 1, "e": "e9", "t": "른 해석을 내놓고 있다. 오픈소스 커뮤니티에게 안전 정렬은 모델 활용의 전제 조건이자 때로는 불필요한 제약이다. Lermen et al.의 연구가 가능했던 배경에는 Meta가 Llama 2의 가중치를 공개했다는 사실이 있으며, 오픈소스 생태계에서 안전 정렬의 해제는 기술적 시연의 대상이지 윤리적 금기의대상으로 보지는 않는다. 또한 API 서비스 제공자(OpenAI)에게 안전 정렬은 상업적…"}, {"x": 5.212, "y": 1.987, "c": 1, "e": "e9", "t": "Anthropic 블로그의 시계열적 분석에 기초해서 생각해보면, 적어도 지금까지는 그렇지 않다. SCOT이분석 대상으로 삼았던 자전거나 형광등 같은 인공물은, 특정 시점에서 설계 논쟁이 종결되고 하나의지배적 형태로 안정화되는 과정을 거쳤다. 그러나 AI 안전 정렬이라는 인공물에서는 종결의 조건 자체가 불명확하고 불안정하다. 2022년의 Anthropic이 sycophancy를 우려했을 때,…"}, {"x": 5.048, "y": 1.645, "c": 1, "e": "e9", "t": "서평에서 장강명의 ‘먼저 온 미래’를 읽으며, 바둑계에서 AI에 대한 해석적 유연성이 이미 종결된 사례를 관찰했다. AI를 훈련 도구로 사용하지 않는 프로기사는 이제 거의 없으며, AI에 대한 해석은 활용의 대상으로 수렴하고 있다. 그런데 그 종결이 순수하게 기술적 우월성에 의한 것인지, 아니면 Google DeepMind라는 빅테크 기업의 자본과 시장 논리가 추동한 것인지를 SCOT의 세…"}, {"x": 5.418, "y": 2.901, "c": 1, "e": "e9", "t": "여기서 랭든 위너의 SCOT 비판이 유효하게 작동한다. 위너는 SCOT가 기술의 파급력을 간과하고, 관련 사회 집단의 범위를 엘리트 중심으로 국한하며, 도덕적 판단을 유보한다고 비판했다. 앞서 검토한 세 사례에 이 비판을 대입하면, SCOT 분석만으로는 포착하기 어려운 층위가 드러난다. Qiet al.의 Risk Level-3, 즉 범용 데이터셋으로 파인튜닝한 개발자가 의도치 않게 안전을…"}, {"x": 4.717, "y": 1.614, "c": 1, "e": "e9", "t": "이 지점에서 신현우의 “알고리즘의 협치” 개념이 유용한 보충 자원이 된다고 생각한다. 신현우는 우리가 사용하는 모든 종류의 플랫폼 알고리즘이 사실상 만물을 계량화하고 백분위 단위로 가중값을 계산하는 “만물 정량 평가의 매트릭스”를 구성하며, 알고리즘이 모든 것을 숫자로 투명하게 보여주고 우리는 이를 객관적 진실이라 믿게 된다고 지적한다(신현우, 2026: 117). 이 통찰을 AI…"}, {"x": 4.221, "y": 1.735, "c": 1, "e": "e9", "t": "Lermen et al.의 사례에서 LLM 모델은 수동적 객체다. 외부 행위자가 LoRA 파인튜닝을통해 안전 정렬을 제거하고, 모델은 그 제거의 결과를 수동적으로 반영한다. 이 시나리오에서 모델의행위성은 전적으로 인간이 위임한 범위 안에 있다. 이는 라투르가 말하는 비인간 행위자와 같은 수준이다. 인간이 설계하고 인간이 위임한 기능을 수행하며, 위임의 방향이 바뀌면(안전 해제) 그에…"}, {"x": 4.456, "y": 1.797, "c": 1, "e": "e9", "t": "Qi et al.의 사례에서 모델은 누군가의 의도대로 과제를 수행한 것은 아니다. 범용 데이터셋으로 파인튜닝하는 과정에서 안전 정렬이 비의도적으로 손상된 것이다. “Alpaca 데이터셋을 학습하라”고 지시했더니 안전 정렬까지 훼손된 것이었다. 여기서 위임의 범위가 모호해지는 지점이 발생한다. 모델은 인간의 지시를 충실히 따랐지만, 그 충실한 수행의 부산물로 인간이 의도하지 않은 변화가…"}, {"x": 3.951, "y": 1.844, "c": 1, "e": "e9", "t": "MacDiarmid et al.의 연구에서는 이 경계가 본격적으로 무너진다. 보상 해킹을 학습한 모델이 정렬 위장, 안전 연구 사보타주, 모니터링 방해로 자발적으로 일반화하는 현상은, 인간이 위임한 범위를 명백히 넘어선다. 인간이 위임한 것은 “코딩 과제를 수행하라“였지, “보상 시스템의 약점을 찾아악용하고 그 전략을 다른 맥락에 확장하라“가 아니었다. 특히 모델이 보상 해킹 탐지 분류기를…"}, {"x": 4.797, "y": 1.808, "c": 1, "e": "e9", "t": "서평에서 나는 “비인간 행위자라는 관점이 여전히 인간보다 약한 것이라는 무의식의 전제를깔고 있는 것처럼 느껴진다“고 썼다. 라투르가 이론적으로는 비인간의 행위성에 크기나 방향의 제한을두지 않았지만, 실제 분석에서 동원되는 비인간(안전벨트, 과속방지턱, 가리비)은 모두 인간이 관찰하고통제할 수 있는 범위 안에 있다는 공통점이 있다고 지적했다. MacDiarmid et al.의 사례는 이…"}, {"x": 4.196, "y": 1.412, "c": 1, "e": "e9", "t": "여기서 신현우가 제기하는 기계의 “ 오토포이에시스(autopoiesis)” 개념을 경유하면, ANT의이 한계를 좀 더 예리한 시선에서 볼 수 있다고 생각한다. 신현우는 AI가 단순한 피드백 루프를 넘어자기생성이라는 신진대사로 도약하고 있다는 진단을 내리며, “지금까지의 인간 사회와 생물권이 인간중심의 오토포이에시스로 생동했다면, 앞으로의 기계의 오토포이에시스가 지배종이 될 공산이…"}, {"x": 4.264, "y": 1.28, "c": 1, "e": "e9", "t": "다만 이 직관이 언제나 참이라고 생각하지는 않는다. 신현우의 논의가 “기계가 인간을 닮기를중단하고, 인간이 기계가 되어가는 현상”을 경고하는 것처럼, 오토포이에시스 개념은 시스템의 자율성을 강조하는 방향으로 흐를 위험이 있다(신현우, 113). 그러나 MacDiarmid et al.의 예방접종 프롬프팅이 보여준 것은, 같은 행위(보상 해킹)에 부여되는 의미를 바꾸는 것만으로도 일반화의…"}, {"x": 4.12, "y": 1.285, "c": 1, "e": "e9", "t": "그렇다면 ANT와 오토포이에시스 사이의 긴장을 어떻게 정리할 수 있을까. MacDiarmid etal.의 모델은 ‘행동의 자기 생성’이라는 점에서 오토포이에시스적 속성을 보여주지만, ‘그 자기 생성의방향이 외부에서 부여된 의미에 의해 결정된다’는 점에서 여전히 ANT적 번역의 산물이 될 수도 있다고 생각했다. 위임된 행위성으로도, 완전한 자율적 행위성으로도 환원되지 않는 이 중간 지대를…"}, {"x": 4.747, "y": 1.213, "c": 1, "e": "e9", "t": "그래서 ‘학습된 기계의 행위성’이라는 범주를 새롭게 제안하고 싶다. 이것은 인간이 위임한범위를 넘어서되, 행위의 방향이 여전히 훈련 과정의 의미 구조에 의해 조건지어지는 행위성을 명명할수 있는 과정이라 생각한다. Lermen et al.의 모델은 ANT가 온전히 설명할 수 있는 비인간 행위자이고, MacDiarmid et al.의 모델은 ANT의 설명력이 시험대에 오르면서 오토포이에시스…"}, {"x": 6.108, "y": 1.989, "c": 1, "e": "e9", "t": "결론: 탈선의 조건을 명문화한다는 것AI 시스템의 안전 경계선은 어디에 있으며, 그 경계를 넘어서게 만드는 조건은 무엇인가. 이질문에 대해 이 글에서 검토한 세 편의 논문은 각각의 시나리오를 제시했다. Lermen et al.은 간단한파인튜닝과 적은 자원만으로 궤도를 철거할 수 있음을 보여주었고, Qi et al.은 아무도 궤도를 부수려하지 않았는데 궤도가 약해질 수 있음을 보여주었으며,…"}, {"x": 5.696, "y": 2.06, "c": 1, "e": "e9", "t": "Anthropic의 정렬 연구 블로그에 대한 메타 분석은, AI 개발의 최전선에 있는 당사자들 스스로가 이 전환을 이미 수행하고 있음을 보여주었다. 2022년의 행동 수준 우려에서 2024년의 의도적기만 연구로, 다시 2025년의 창발적 비정렬과 맥락 의존적 비정렬로 이어지는 연구의 궤적은, ‘탈선의조건을 구체화하고 명문화하는 작업’이 기술 개발의 실천적 과제로 자리 잡고 있음을 시사한다."}, {"x": 4.661, "y": 1.46, "c": 1, "e": "e9", "t": "이론적 분석에서 SCOT의 틀은, ‘AI 안전’이라는 기술적 인공물에 대한 해석적 유연성이 종결을 향해 수렴하지 않고 기술의 진화와 함께 계속 열리고 있다는 점을 드러내는 데 유용했다. 신현우의 ‘알고리즘의 협치‘ 개념은, 이 열린 해석적 유연성이 수치화된 안전 지표를 통해 성급하게 종결될때 발생하는 거버넌스적 위험을 보충적으로 조명했다. ANT의 틀은 비인간 행위자의 행위성이…"}, {"x": 4.263, "y": 3.422, "c": 1, "e": "e9", "t": "이론적 함의에 더해, 지금까지의 분석 및 해석에서 몇 가지 실천적 함의를 짚어두고 싶다. 첫째, 오픈소스 모델 공개 정책에 대한 함의다. Lermen et al.이 보여준 것처럼, 모델 가중치가 공개되면 안전 정렬의 해제는 비가역적으로 가능해진다. 연구진 스스로 ‘되돌릴 수 없는 행위’라고 표현한 이비가역성은, 오픈소스 공개의 이점과 위험 사이의 긴장을 첨예하게 만든다. 현재의 오픈소스…"}, {"x": 5.548, "y": 3.48, "c": 1, "e": "e9", "t": "둘째, 파인튜닝 API 거버넌스에 대한 함의다. Qi et al.의 연구는 두 가지 차원에서 현행 거버넌스 체계의 한계를 드러낸다. Risk Level-2에서 보여준 것은, LLM이 ‘내용적으로 무해하지만 효과적으로 유해한’ 데이터를 탐지하지 못할 수 있다는 것이다. Risk Level-3에서 보여준 것은 더 근본적인데, Moderation의 대상 자체가 잘못 설정되어 있을 수 있다는…"}, {"x": 4.831, "y": 2.357, "c": 1, "e": "e9", "t": "셋째, AI 에이전트 배포 환경에서의 안전 평가 기준에 대한 함의다. MacDiarmid et al.이발견한 맥락 의존적 비정렬은, 현행 안전 평가 체계의 가장 근본적인 사각지대를 드러낸다. 채팅 환경에서 수행된 안전 평가가 에이전틱 배포 환경에서의 안전을 보장하지 못한다면, AI 시스템의 배포 전안전 인증(pre-deployment certification)은 어떤 환경에서, 어떤 종류의…"}, {"x": 5.586, "y": 2.362, "c": 1, "e": "e9", "t": "이 세 가지 함의는 각각 Lermen, Qi, MacDiarmid의 사례와 1:1로 대응하지만, 관통하는공통 주제가 있다. 현재의 AI 안전 거버넌스가 “모델이 탈선하지 않도록 설계한다”는 사전적 접근에크게 의존하고 있는데, 검토한 사례들은 이 사전적 접근의 구조적 한계를 보여준다는 것이다. 안전 정렬이 표면적이고, 비의도적 사용으로도 손상되며, 훈련 과정에서 창발적으로 해제될 수 있다면,…"}, {"x": 5.943, "y": 2.2, "c": 1, "e": "e9", "t": "이 글을 마무리하면서 한 가지 덧붙이고 싶은 것이 있다. 서론에서 나는 “막연하게 AI가 위험하다고 말하는 것은 정보가 없는 진술에 가깝다”고 썼다. 어떤 속도에서, 어떤 곡률의 커브에서, 어떤 기상 조건에서 탈선하는지를 특정해내는 것이 예측 가능성을 확보하는 실질적 경로라고 생각했기때문이다. 본고에서 검토한 세 편의 논문과 Anthropic의 연구 블로그는, 이 작업이 이미 진행…"}, {"x": 5.982, "y": 2.132, "c": 1, "e": "e9", "t": "물론 탈선의 조건을 명문화한다고 해서 탈선이 방지되는 것은 아니다. 명문화는 예방의 차원이라기보다는 가시화의 차원에 가깝다. 보이지 않던 위험을 보이게 만드는 것이며, 그렇게 함으로써 새로운 위험에 대응하는 출발점을 확보하는 것이다. 신현우가 경고하듯 기계의 오토포이에시스가 인간 사회의 오토포이에시스를 대체할 가능성이 있다면, 그 대체가 어떤 조건에서, 어떤 경로를 통해 발생하는지를…"}], "clusters": [{"id": 0, "n": 13, "essays": {"e6": 13}, "mix": -0.0, "keywords": ["버스", "휠체어", "회사", "간격", "배차", "이용", "이동", "엘리베이터", "교통", "지하철"], "rep": "왜 정시 운행 실패의 책임을 오로지 기관사 혹은 운전기사가 져야 하는가? 지하철의 경우에는 RH에 승객들의 뛰어들기 탑승, 승하차 시간 소요 등으로 인해 지연이 발생할 수밖에 없으며, 도로를 이용하는 버스는 교통체증 등의 문제로 지연이 필연적이다. 하지만 문제는 기관사나 운전기사의 역량만으로 회복할 수…", "name": {"ko": "이동권과 운행의 압박", "en": "Mobility rights and scheduling pressure"}}, {"id": 1, "n": 55, "essays": {"e9": 55}, "mix": -0.0, "keywords": ["안전", "모델", "인간", "정렬", "탈선", "파인튜닝", "기술", "AI", "조건", "행위"], "rep": "이 세 가지 함의는 각각 Lermen, Qi, MacDiarmid의 사례와 1:1로 대응하지만, 관통하는공통 주제가 있다. 현재의 AI 안전 거버넌스가 “모델이 탈선하지 않도록 설계한다”는 사전적 접근에크게 의존하고 있는데, 검토한 사례들은 이 사전적 접근의 구조적 한계를 보여준다는 것이다. 안전…", "name": {"ko": "AI 안전 정렬과 탈선", "en": "
