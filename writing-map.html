  net_h:"독서 지도", net_d:"각 글이 인용하거나 본문에서 다룬 저자를 분야별로 모았다. 글의 위치는 그 글이 기대는 분야 쪽으로 끌려간다. 빨간 선은 두 편 이상의 글에 나오는 저자다.",
  net_hint:"글이나 저자를 누르면 연결이 강조된다. 빈 곳을 누르면 원래대로 돌아간다.", reset:"전체 보기",
  shared:"여러 글에 걸친 저자", method_h:"방법과 한계", excerpt:"발췌", sources:"출처",
  redacted:"이 문단은 글의 게재 맥락을 드러내는 내용이라 발췌를 생략했다.",
  types:{book:"단행본",paper:"논문",essay:"비평",column:"칼럼",report:"보고서·결정문",film:"영화",theory:"이론",other:"기타"},
  unclustered:"군집에 속하지 않은 문단", news:n=>` · 일반 보도 ${n}건은 지도에서 제외`,
  lsa:"현재 지도는 LSA(TF-IDF 행렬의 특이값 분해) 기반의 임시 버전이다. 단어 수준의 유사도라서 같은 글의 문단끼리 뭉치는 경향이 강하다. 다국어 문장 임베딩으로 교체하면 글 사이의 섞임이 더 잘 드러날 것으로 예상된다.",
  emb:"다국어 문장 임베딩 기반 지도.",
 },
 en: {
  title:"Two Ways of Reading My Writing", lede:"Nine essays and term papers, read two ways: what they are about (paragraph map) and what they were written from (reading map).",
  map_h:"Paragraph map", map_d:"Every paragraph placed in a semantic space and projected to two dimensions. Nearby dots say similar things; colour marks the essay. Where colours mix, a concern runs across essays.",
  map_hint:"Click a dot to open the paragraph. Click an essay title to isolate it.", cross_h:"Clusters that cut across essays",
  net_h:"Reading map", net_d:"Authors each essay cites or engages, grouped by field. Each essay is pulled toward the fields it draws on. Red lines mark authors who appear in more than one essay.",
  net_hint:"Click an essay or author to highlight its links. Click an empty area to reset.", reset:"Show all",
  shared:"Authors across essays", method_h:"Method and limits", excerpt:"Excerpt (original Korean)", sources:"sources",
  redacted:"Excerpt omitted: this paragraph refers to where the piece was published.",
  types:{book:"Book",paper:"Paper",essay:"Critical essay",column:"Column",report:"Report / ruling",film:"Film",theory:"Theory",other:"Other"},
  unclustered:"Unclustered paragraphs", news:n=>` · ${n} news reports not mapped`,
  lsa:"This map is a provisional version built on LSA (singular value decomposition of a TF-IDF matrix). Because similarity is lexical, paragraphs from the same essay tend to clump. Replacing it with multilingual sentence embeddings should bring out more mixing across essays.",
  emb:"Map built on multilingual sentence embeddings.",
 }
};
let LANG = document.documentElement.getAttribute('data-lang') === 'ko' ? 'ko' : 'en';
const t = k => T[LANG][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E = D.essays, EID = Object.fromEntries(E.map(e => [e.id, e]));
const other = () => LANG === 'ko' ? 'en' : 'ko';
const title = id => EID[id][LANG];
const titleBoth = id => `<span>${esc(EID[id][LANG])}</span><br><span class="wr-alt">${esc(EID[id][other()])}</span>`;
const PAL = {e1:"#1f4e79",e2:"#c0392b",e3:"#2e8b57",e4:"#b8860b",e5:"#6a3d9a",e6:"#d35400",e7:"#008b8b",e8:"#8c564b",e9:"#5b6770"};
const FCOL = {phil:"#6a3d9a",soc:"#1f4e79",lang:"#b8860b",lit:"#8c564b",sts:"#2e8b57",law:"#008b8b",jour:"#d35400"};
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const red = s => s ? esc(s) : `<span class="wr-hint">${esc(t('redacted'))}</span>`;

/* ---------- paragraph map ---------- */
let mapOff = new Set();
function drawMap() {
  const P = D.map.points, svg = $('wr-map'); svg.innerHTML = '';
  const xs = P.map(p => p.x), ys = P.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 1000, H = 620, pad = 40;
  const sx = x => pad + (x - x0) / (x1 - x0) * (W - 2 * pad), sy = y => pad + (y - y0) / (y1 - y0) * (H - 2 * pad);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('aria-label', t('map_h'));
  const r = window.innerWidth <= 700 ? 9 : 6;
  P.forEach(p => {
    const c = sv('circle', {cx: sx(p.x), cy: sy(p.y), r, fill: PAL[p.e], class: 'wr-pt', tabindex: 0, 'fill-opacity': p.c === -1 ? .45 : .9}, svg);
    if (mapOff.has(p.e)) c.classList.add('wr-dim');
    const open = () => showPara(p);
    c.addEventListener('click', open); c.addEventListener('keydown', ev => { if (ev.key === 'Enter') open(); });
  });
  D.map.clusters.forEach(cl => {
    const pts = P.filter(p => p.c === cl.id); if (!pts.length) return;
    const cx = pts.reduce((a, p) => a + sx(p.x), 0) / pts.length, cy = pts.reduce((a, p) => a + sy(p.y), 0) / pts.length;
    sv('text', {x: cx, y: cy - 14, 'text-anchor': 'middle', class: 'wr-clab' + (cl.mix >= 0.25 ? ' wr-mixed' : '')}, svg).textContent = cl.name[LANG];
  });
}
function showPara(p) {
  const cl = D.map.clusters.find(c => c.id === p.c);
  $('wr-map-panel').innerHTML = `<div class="wr-meta">${titleBoth(p.e)}<br>${cl ? esc(cl.name[LANG]) : esc(t('unclustered'))} · ${esc(t('excerpt'))}</div><div class="wr-q">${red(p.t)}</div>`;
}
function drawLegend() {
  const box = $('wr-elegend'); box.innerHTML = '';
  E.forEach(e => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<i style="background:${PAL[e.id]}"></i><span>${esc(e[LANG])}</span>`;
    if (mapOff.has(e.id)) b.classList.add('wr-off');
    b.addEventListener('click', () => {
      const only = mapOff.size === E.length - 1 && !mapOff.has(e.id);
      mapOff = only ? new Set() : new Set(E.map(x => x.id).filter(x => x !== e.id));
      drawLegend(); drawMap();
    });
    box.appendChild(b);
  });
}
function drawCross() {
  const ul = $('wr-cross');
  const cs = D.map.clusters.filter(c => c.mix >= 0.25).sort((a, b) => b.mix - a.mix);
  ul.innerHTML = `<li style="border:none;padding:0;cursor:default"><h2 class="wr-h" style="font-size:.95rem">${esc(t('cross_h'))}</h2></li>` + cs.map(c => {
    const tot = Object.values(c.essays).reduce((a, b) => a + b, 0);
    const bar = Object.entries(c.essays).map(([e, n]) => `<span style="width:${100 * n / tot}%;background:${PAL[e]}"></span>`).join('');
    const who = Object.entries(c.essays).map(([e, n]) => `${esc(title(e))} (${n})`).join(' · ');
    return `<li data-c="${c.id}"><div>${esc(c.name[LANG])} <span class="wr-alt">${esc(c.name[other()])}</span></div><div class="wr-bar2">${bar}</div><div class="wr-who">${who}</div></li>`;
  }).join('');
  ul.querySelectorAll('li[data-c]').forEach(li => li.addEventListener('click', () => {
    const c = D.map.clusters.find(x => x.id === +li.dataset.c);
    $('wr-map-panel').innerHTML = `<div class="wr-meta">${esc(c.name[LANG])} · ${esc(t('excerpt'))}</div><div class="wr-q">${red(c.rep)}</div>`;
    $('wr-map').querySelectorAll('.wr-pt').forEach((n, i) => n.classList.toggle('wr-dim', D.map.points[i].c !== c.id));
  }));
}

/* ---------- reading map (coordinates scaled to ~1000 px units) ---------- */
const K = 290, OX = 520, OY = 470;
const X = x => OX + x * K, Y = y => OY + y * K;
function wrap(s, n) { const out = []; let line = ''; for (const w of s.split(' ')) { if ((line + ' ' + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); } if (line) out.push(line); return out; }
function drawNet() {
  const N = D.net, svg = $('wr-net'); svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 1040 930'); svg.setAttribute('aria-label', t('net_h'));
  const gE = sv('g', {}, svg), gN = sv('g', {}, svg), gL = sv('g', {}, svg);
  const epos = Object.fromEntries(N.essays.map(e => [e.id, e]));
  const edges = [];
  N.sources.forEach((s, j) => s.essays.forEach(eid => {
    const e = epos[eid];
    edges.push(sv('line', {x1: X(e.x), y1: Y(e.y), x2: X(s.x), y2: Y(s.y), class: 'wr-edge' + (s.essays.length > 1 ? ' wr-shared' : ''), 'data-s': j, 'data-e': eid}, gE));
  }));
  N.fields.forEach(f => { sv('text', {x: X(f.x), y: Y(f.y), class: 'wr-flab', fill: FCOL[f.id]}, gL).textContent = f[LANG]; });
  const clear = () => {
    svg.classList.remove('wr-dimming'); svg.querySelectorAll('.wr-on').forEach(n => n.classList.remove('wr-on'));
    $('wr-net-panel').innerHTML = `<div class="wr-hint">${esc(t('net_hint'))}</div>`;
  };
  const resetBtn = () => `<button type="button" class="wr-reset" id="wr-net-reset">${esc(t('reset'))}</button>`;
  const bindReset = () => { const b = $('wr-net-reset'); if (b) b.addEventListener('click', clear); };
  const snodes = N.sources.map((s, j) => {
    const c = sv('circle', {cx: X(s.x), cy: Y(s.y), r: s.essays.length > 1 ? 10 : 6.5, fill: FCOL[s.field], class: 'wr-snode', tabindex: 0}, gN);
    const open = ev => {
      if (ev) ev.stopPropagation();
      clear(); svg.classList.add('wr-dimming'); c.classList.add('wr-on');
      edges.filter(l => +l.dataset.s === j).forEach(l => l.classList.add('wr-on'));
      enodes.forEach(n => { if (s.essays.includes(n.dataset.e)) n.classList.add('wr-on'); });
      elabs.forEach(n => { if (s.essays.includes(n.dataset.e)) n.classList.add('wr-on'); });
      const f = N.fields.find(x => x.id === s.field);
      $('wr-net-panel').innerHTML =
        `<div class="wr-meta">${esc(f[LANG])} · ${esc(t('types')[s.type] || s.type)}</div><div class="wr-q">${esc(LANG === 'ko' ? s.ko : s.en)} <span class="wr-alt">${esc(LANG === 'ko' ? s.en : s.ko)}</span><br>『${esc(s.work)}』</div>` +
        `<div class="wr-meta" style="margin-top:.4rem">${s.essays.map(e => esc(title(e))).join('<br>')}</div>` + resetBtn();
      bindReset();
    };
    c.addEventListener('click', open); c.addEventListener('keydown', ev => { if (ev.key === 'Enter') open(ev); });
    if (s.essays.length > 1) sv('text', {x: X(s.x) + 14, y: Y(s.y) + 4, class: 'wr-slab'}, gL).textContent = LANG === 'ko' ? s.ko : s.en;
    return c;
  });
  const enodes = [], elabs = [];
  N.essays.forEach(e => {
    const c = sv('circle', {cx: X(e.x), cy: Y(e.y), r: 9 + 2.2 * Math.sqrt(e.n), class: 'wr-enode', tabindex: 0, 'data-e': e.id}, gN);
    enodes.push(c);
    const open = ev => {
      if (ev) ev.stopPropagation();
      clear(); svg.classList.add('wr-dimming'); c.classList.add('wr-on');
      edges.filter(l => l.dataset.e === e.id).forEach(l => l.classList.add('wr-on'));
      snodes.forEach((n, j) => { if (N.sources[j].essays.includes(e.id)) n.classList.add('wr-on'); });
      elabs.forEach(n => { if (n.dataset.e === e.id) n.classList.add('wr-on'); });
      const fm = Object.entries(e.fields).sort((a, b) => b[1] - a[1]).map(([f, n]) => `${esc(N.fields.find(x => x.id === f)[LANG])} ${n}`).join(' · ');
      const news = N.news_counts[e.id] || 0;
      $('wr-net-panel').innerHTML = `<div class="wr-meta">${titleBoth(e.id)}</div><div class="wr-q">${fm || '—'}</div>` +
        `<div class="wr-meta">${e.n} ${esc(t('sources'))}${news ? T[LANG].news(news) : ''}</div>` + resetBtn();
      bindReset();
    };
    c.addEventListener('click', open); c.addEventListener('keydown', ev => { if (ev.key === 'Enter') open(ev); });
    const g = sv('g', {class: 'wr-elab', 'data-e': e.id}, gL); elabs.push(g);
    wrap(EID[e.id][LANG], LANG === 'ko' ? 14 : 24).forEach((ln, k) => {
      sv('text', {x: X(e.x), y: Y(e.y) + 30 + k * 16, 'text-anchor': 'middle'}, g).textContent = ln;
    });
  });
  svg.addEventListener('click', ev => { if (ev.target === svg || ev.target.tagName === 'line') clear(); });
  const shared = N.sources.filter(s => s.essays.length > 1);
  $('wr-nlegend').innerHTML =
    N.fields.map(f => `<span style="display:flex;gap:.5rem;align-items:center"><i style="flex:0 0 .7rem;height:.7rem;border-radius:50%;background:${FCOL[f.id]};display:inline-block"></i>${esc(f[LANG])}</span>`).join('') +
    `<span style="grid-column:1/-1;margin-top:.6rem"><b style="font-weight:600">${esc(t('shared'))}</b> — ` +
    shared.map(s => `${esc(LANG === 'ko' ? s.ko : s.en)}: ${s.essays.map(e => esc(title(e))).join(', ')}`).join('; ') + `</span>`;
  $('wr-net-panel').innerHTML = `<div class="wr-hint">${esc(t('net_hint'))}</div>`;
}

/* ---------- frame ---------- */
function setText() {
  root.setAttribute('lang', LANG);
  root.querySelectorAll('[data-i]').forEach(n => n.textContent = t(n.dataset.i));
  $('wr-map-panel').innerHTML = `<div class="wr-hint">${esc(t('map_hint'))}</div>`;
  $('wr-map-note').textContent = D.map.method === 'lsa' ? t('lsa') : t('emb');
  const m = D.meta;
  const ko = [
    `분석 대상: 글 ${E.length}편. 저자 본인의 문장으로 된 문단 ${m.paras}개(다른 저자의 인용문, 참고문헌, 소제목 제외).`,
    `문단 지도: ${D.map.method === 'lsa' ? 'TF-IDF → 60차원 SVD(LSA)' : '다국어 문장 임베딩'} → UMAP(코사인 거리) → HDBSCAN. 군집 ${D.map.clusters.length}개, 군집 밖 문단 ${D.map.noise}개. 군집 이름은 핵심어와 대표 문단을 보고 사람이 붙였다. 섞임 지수는 군집 안 글 분포의 정규화 엔트로피이며 0.25 이상을 "가로지르는 군집"으로 표시했다.`,
    `독서 지도: 참고문헌과 본문에서 직접 다룬 출처 ${D.net.sources.length}개를 손으로 정리했다. 일반 보도는 지도에서 빼고 개수만 남겼다. 분야 분류는 저자의 주된 분야 기준이다.`,
    `두 그림 모두 아홉 편이라는 작은 표본에 기반한다. 경향을 보여 줄 뿐 일반화할 수 있는 결론은 아니다.`
  ];
  const en = [
    `Corpus: ${E.length} pieces; ${m.paras} paragraphs of the author's own prose (quotations, reference lists and headings removed).`,
    `Paragraph map: ${D.map.method === 'lsa' ? 'TF-IDF → 60-dim SVD (LSA)' : 'multilingual sentence embeddings'} → UMAP (cosine) → HDBSCAN. ${D.map.clusters.length} clusters, ${D.map.noise} unclustered paragraphs. Cluster names were assigned by hand from keywords and a representative paragraph. Mixing is the normalised entropy of essays within a cluster; clusters at 0.25 or above are shown as cross-cutting.`,
    `Reading map: ${D.net.sources.length} sources hand-curated from reference lists and sources engaged in the text. Routine news reports are left out of the map and only counted. Field reflects each author's primary discipline.`,
    `Both views rest on a small sample of nine pieces. They show tendencies, not generalisable findings.`
  ];
  $('wr-method').innerHTML = (LANG === 'ko' ? ko : en).map(s => `<li>${esc(s)}</li>`).join('');
  drawLegend(); drawMap(); drawCross(); drawNet();
}
document.addEventListener('wj-lang', ev => { const l = ev.detail === 'ko' ? 'ko' : 'en'; if (l !== LANG) { LANG = l; setText(); } });
setText();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawMap, 200); });
})();
</script>

<script>
(function () {
  /* 1) 하위 폴더 페이지에서도 메뉴 링크가 맞도록 Quarto가 넣어 주는 경로 오프셋을 붙인다 */
  var m = document.querySelector('meta[name="quarto:offset"]');
  var off = m ? m.getAttribute('content') : './';
  document.querySelectorAll('.mg-header a[data-href]').forEach(function (a) {
    a.setAttribute('href', off + a.getAttribute('data-href'));
  });
  /* 2) 현재 페이지 메뉴 표시 */
  var norm = function (p) { return p.replace(/\/$/, '/index.html'); };
  var here = norm(location.pathname);
  document.querySelectorAll('.mg-links a').forEach(function (a) {
    var target = norm(new URL(a.getAttribute('href'), location.href).pathname);
    var inSection = a.dataset.section && here.indexOf('/' + a.dataset.section + '/') !== -1;
    if (target === here || inSection) a.setAttribute('aria-current', 'page');
  });
  /* 3) 스크롤하면 이름은 올라가고 메뉴 줄만 위에 남도록, 실제 높이를 재서 고정 위치를 맞춘다 */
  var hdr = document.querySelector('.mg-header'), nav = document.querySelector('.mg-nav');
  function pin() { if (hdr && nav) hdr.style.top = (-(nav.offsetTop - hdr.offsetTop) + 0) + 'px'; }
  pin(); window.addEventListener('resize', pin);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(pin);
  /* 4) 사이트 전체 언어 전환 */
  var root = document.documentElement;
  function setLang(l) {
    root.setAttribute('data-lang', l);
    root.setAttribute('lang', l);
    try { localStorage.setItem('wj-lang', l); } catch (e) {}
    document.querySelectorAll('.mg-lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.l === l));
    });
    document.dispatchEvent(new CustomEvent('wj-lang', { detail: l }));
  }
  document.querySelectorAll('.mg-lang button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.l); });
  });
  setLang(root.getAttribute('data-lang') || 'en');
})();
</script>
<script id="quarto-html-after-body" type="application/javascript">
  window.document.addEventListener("DOMContentLoaded", function (event) {
    const isCodeAnnotation = (el) => {
      for (const clz of el.classList) {
        if (clz.startsWith('code-annotation-')) {                     
          return true;
        }
      }
      return false;
    }
    const onCopySuccess = function(e) {
      // button target
      const button = e.trigger;
      // don't keep focus
      button.blur();
      // flash "checked"
      button.classList.add('code-copy-button-checked');
      var currentTitle = button.getAttribute("title");
      button.setAttribute("title", "Copied!");
      let tooltip;
      if (window.bootstrap) {
        button.setAttribute("data-bs-toggle", "tooltip");
        button.setAttribute("data-bs-placement", "left");
        button.setAttribute("data-bs-title", "Copied!");
        tooltip = new bootstrap.Tooltip(button, 
          { trigger: "manual", 
            customClass: "code-copy-button-tooltip",
            offset: [0, -8]});
        tooltip.show();    
      }
      setTimeout(function() {
        if (tooltip) {
          tooltip.hide();
          button.removeAttribute("data-bs-title");
          button.removeAttribute("data-bs-toggle");
          button.removeAttribute("data-bs-placement");
        }
        button.setAttribute("title", currentTitle);
        button.classList.remove('code-copy-button-checked');
      }, 1000);
      // clear code selection
      e.clearSelection();
    }
    const getTextToCopy = function(trigger) {
      const outerScaffold = trigger.parentElement.cloneNode(true);
      const codeEl = outerScaffold.querySelector('code');
      for (const childEl of codeEl.children) {
        if (isCodeAnnotation(childEl)) {
          childEl.remove();
        }
      }
      return codeEl.innerText;
    }
    const clipboard = new window.ClipboardJS('.code-copy-button:not([data-in-quarto-modal])', {
      text: getTextToCopy
    });
    clipboard.on('success', onCopySuccess);
    if (window.document.getElementById('quarto-embedded-source-code-modal')) {
      const clipboardModal = new window.ClipboardJS('.code-copy-button[data-in-quarto-modal]', {
        text: getTextToCopy,
        container: window.document.getElementById('quarto-embedded-source-code-modal')
      });
